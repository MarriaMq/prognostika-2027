<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Прогностика 2027</title>
<link rel="preload" as="image" href="assets/veronika.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/goat-sun.webp">
<link rel="preload" as="image" href="assets/sky-bg.webp">
<link rel="preload" as="image" href="assets/month-bg.webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Прогностика 2027, v3: атмосферная тёмная тема.
   Алый из фото скалы для заголовков и акцентов, тёплый светлый для длинного текста,
   засечки Cormorant Garamond для заголовков, Inter для текста. */
:root{
  --bg0:#0C0607;
  --bg1:#170A0B;
  --wine:#2B0C0F;
  --scarlet:#E8452C;
  --scarlet-2:#CE2E1B;
  --deep:#921D25;
  --cream:#F2EDE5;
  --cream-2:rgba(242,237,229,.72);
  --cream-3:rgba(242,237,229,.46);
  --hair:rgba(242,237,229,.16);
  --glass:rgba(255,236,226,.05);
  --glass-2:rgba(255,236,226,.09);
  --sea:#5B6B7A;
  --navy:#14243A;
  --ok:#8FD3A8;
  --red-grad:radial-gradient(ellipse at 75% 120%,#F0583C 0%,#CE2E1B 45%,#7A1016 100%);
  --f-serif:'Cormorant Garamond','Cormorant',Georgia,serif;
  --f-text:'Inter',system-ui,sans-serif;
  --g:24px;
  /* вырез и полоска телефона (iOS и Android) + кнопки Telegram в полноэкранном режиме (Bot API 8.0 задаёт эти переменные сам) */
  --safe-t:calc(max(env(safe-area-inset-top,0px), var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  --safe-b:calc(max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px)) + var(--tg-content-safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.2,1.12,.32,1);
  --slow:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1 !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg0);color:var(--cream);font-family:var(--f-text);font-feature-settings:"lnum" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

#app{position:relative;width:100%;height:var(--tg-viewport-stable-height,100dvh);overflow:hidden;background:var(--bg0)}
@supports not (height:100dvh){ #app{height:var(--tg-viewport-stable-height,100vh)} }
@media (min-width:600px){
  body{display:grid;place-items:center;background:#050304}
  #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 0 0 1px rgba(242,237,229,.08),0 40px 100px rgba(0,0,0,.6)}
  body.tg{display:block;background:var(--bg0)}
  body.tg #app{width:100%;max-width:560px;margin:0 auto;height:var(--tg-viewport-stable-height,100vh);border-radius:0;box-shadow:none}
}

/* Экран: тёмный тёплый фон, сверху винное свечение, снизу силуэт скалы */
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;color:var(--cream);opacity:0;transform:translateX(42px);transition:opacity .45s ease,transform .7s var(--spring);overflow:hidden;
  background:radial-gradient(120% 60% at 85% -10%,rgba(146,29,37,.4) 0%,rgba(146,29,37,0) 60%),radial-gradient(90% 50% at 0% 110%,rgba(206,46,27,.22) 0%,rgba(206,46,27,0) 70%),linear-gradient(180deg,#140809 0%,#0C0607 55%,#0A0506 100%)}
.screen.in{opacity:1;transform:none}
.screen.back{transform:translateX(-42px)}
.screen.back.in{transform:none}
.screen.fade{transform:scale(1.05);transition:opacity 1s ease,transform 1.4s var(--ease)}
.screen.fade.in{transform:none}
.screen > *{position:relative;z-index:1}
.rockbg{position:absolute !important;z-index:0 !important;left:-10%;right:-10%;bottom:-2%;height:34%;background:url(assets/rock.webp) center 30%/cover;opacity:.15;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 70%);mask-image:linear-gradient(180deg,transparent 0%,#000 70%);pointer-events:none;filter:saturate(1.1)}
.rise{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i, 0) * 35ms + 20ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(242,237,229,.14) transparent}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(242,237,229,.14);border-radius:2px}

/* Типографика */
.eyebrow{font:500 11px/1.4 var(--f-text);letter-spacing:.42em;text-transform:uppercase;color:var(--cream-3)}
.serif{font-family:var(--f-serif)}
.rule{display:block;width:44px;height:1px;background:var(--hair);margin:18px 0}
.h1{font:500 34px/1.08 var(--f-serif);letter-spacing:-.01em;color:var(--scarlet)}
.h1 em{font-style:italic}
.lead{font:300 16px/1.6 var(--f-text);color:var(--cream-2);margin-top:14px}

/* Пылинки и звёзды */
.dust{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
.dust i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,214,190,.85);box-shadow:0 0 8px rgba(255,140,110,.7);opacity:0;animation:float var(--d) linear var(--dl) infinite}
@keyframes float{0%{transform:translate(0,0);opacity:0}18%{opacity:.8}100%{transform:translate(var(--x),-140px);opacity:0}}
.stars i{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7);animation:twinkle var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.85}}

/* ---------- 1. Заставка: пролёт камеры в дверь сквозь туман (анимация клиентки) ---------- */
.intro{background:#0b1a33;transition:none;cursor:pointer}
.iscene{position:absolute !important;z-index:0 !important;top:0;right:0;bottom:0;left:0;transform-origin:0 0;will-change:transform}
.iscene img{position:absolute;left:0;top:0;display:block;max-width:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.fog{position:absolute;left:0;width:100%;pointer-events:none;overflow:hidden;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);animation:fogbreath var(--br) ease-in-out infinite alternate;transform-origin:50% 100%;transition:opacity 2s ease}
.fog .tile{position:absolute;left:0;top:0;width:200%;height:100%;background-repeat:repeat-x;background-size:50% 100%;will-change:transform;animation:fogx var(--dur) linear infinite var(--dir),fogy var(--bob) ease-in-out infinite alternate}
.fog.fA{top:60%;height:40%}
.fog.fB{top:36%;height:26%}
.fog.fC{top:70%;height:34%}
@keyframes fogx{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fogy{from{translate:0 0}to{translate:0 -7%}}
@keyframes fogbreath{from{transform:none}to{transform:translateY(var(--by)) scaleY(1.12)}}
.intro .shade{position:absolute !important;z-index:2 !important;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,13,27,.42) 0%,rgba(6,13,27,0) 30%);transition:opacity .8s linear}
.intro.fly .shade{opacity:0}
.ifade{position:absolute !important;z-index:4 !important;top:0;right:0;bottom:0;left:0;background:#5B86AF;opacity:0;pointer-events:none}
.intro .ttl{position:absolute !important;z-index:3 !important;left:0;right:0;top:calc(var(--safe-t) + 9%);text-align:center;padding:0 var(--g);transition:opacity .36s ease,transform .36s ease}
.intro.fly .ttl{opacity:0;transform:translateY(-12px);transition:opacity .5s ease .55s,transform .6s ease .55s} /* надпись ещё видна в начале полёта, чтобы её успели прочитать */
.intro .ttl .eyebrow{color:rgba(242,237,229,.85);margin-bottom:14px;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.intro .ttl h1{font:400 clamp(34px,9.6vw,46px)/1 var(--f-serif);letter-spacing:.02em;color:var(--cream);text-shadow:0 2px 24px rgba(0,0,0,.35)}
.intro .ttl h1 em{display:block;font-style:normal;font-weight:400;font-size:1.85em;line-height:.95;color:var(--scarlet);margin-top:4px}
.intro .ttl > *{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .5s var(--ease)}
.intro.push .ttl > *{opacity:1;transform:none}
.intro.push .ttl > :nth-child(2){transition-delay:.08s}

/* ---------- Язык ---------- */
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(10px);z-index:0}
.glow.a{width:120%;height:55%;left:-10%;top:-14%;background:radial-gradient(closest-side,rgba(206,46,27,.32),rgba(206,46,27,0))}
.glow.b{width:90%;height:50%;right:-30%;bottom:-6%;background:radial-gradient(closest-side,rgba(232,69,44,.16),rgba(232,69,44,0))}
.lwrap{padding:calc(var(--safe-t) + 70px) var(--g) calc(28px + var(--safe-b));display:flex;flex-direction:column;height:100%;text-align:center}
.lq{font:400 42px/1.08 var(--f-serif);color:var(--scarlet);margin-top:22px}
.lq span{display:block;font-style:italic;color:var(--cream-3);margin-top:4px}
.lwrap .rule{margin:26px auto 0}
.lchoices{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.dk-btn{width:100%;min-height:76px;border-radius:20px;border:1px solid var(--hair);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 22px;display:flex;align-items:center;gap:18px;text-align:left;transition:background .25s,border-color .25s,transform .15s}
.dk-btn:active{background:var(--glass-2);border-color:rgba(232,69,44,.6);transform:scale(.99)}
.dk-btn .code{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;font:500 12px/1 var(--f-text);letter-spacing:.12em;color:var(--scarlet);flex-shrink:0}
.dk-btn .n{display:block;font:500 22px/1.1 var(--f-serif)}
.dk-btn .d{display:block;font:300 13px/1.4 var(--f-text);color:var(--cream-3);margin-top:3px}

/* ---------- 2. Онбординг ---------- */
.onb .top{z-index:3;height:60px;margin-top:var(--safe-t);padding:0 12px 0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.onb .brand,.night .brand{font:500 10px/1 var(--f-text);letter-spacing:.42em;text-transform:uppercase;color:var(--cream-3);white-space:nowrap}
.skip{height:44px;padding:0 12px;font:400 14px/1 var(--f-text);color:var(--cream-2);transition:opacity .3s}
.onb.last .skip{opacity:0;pointer-events:none}
.ovp{flex:1;overflow:hidden;touch-action:pan-y}
.pager{display:flex;height:100%;will-change:transform}
.slide{flex:0 0 100%;height:100%;position:relative;display:flex;flex-direction:column;padding:0 var(--g);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.ill{position:relative;flex:1;min-height:180px;display:grid;place-items:center;transform:translateX(calc(var(--p,0) * -55%))}
.otx{transform:translateX(calc(var(--p,0) * 22%));opacity:var(--o,1);padding-bottom:8px}
.pager.anim,.pager.anim .ill,.pager.anim .otx{transition:transform .55s var(--spring),opacity .4s ease}
.otx h2{font:400 clamp(30px,9vw,36px)/1.08 var(--f-serif);color:var(--scarlet)}
.otx h2 em{font-style:italic;color:var(--cream)}
.otx p{font:300 16px/1.6 var(--f-text);color:var(--cream-2);margin-top:14px}
.otx .fine{font-size:14px;color:var(--cream-3);margin-top:14px}
.ogl{position:absolute !important;z-index:0 !important;top:0;right:0;bottom:0;left:0;pointer-events:none;transition:transform .55s var(--spring)}
.onb .bottom{z-index:3}
.dots{display:flex;gap:8px;justify-content:center;height:20px;align-items:center}
.dots i{width:5px;height:5px;border-radius:3px;background:rgba(242,237,229,.25);transition:width .45s var(--spring),background .3s}
.dots i.on{width:24px;background:var(--scarlet)}
.onb .b-last{display:none}
.onb.last .b-next{display:none}
.onb.last .b-last{display:flex}

.orb{position:relative;width:min(250px,64vw);aspect-ratio:1}
.orb .ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:1px solid rgba(242,237,229,.1)}
.orb .ring.r2{inset:16%;border-color:rgba(232,69,44,.22)}
.orb .date{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(40px,12vw,50px)/1 var(--f-serif);color:var(--cream)}
.orb .date span{display:inline-block}
.slide.seen .orb .date span{animation:digit 1.5s var(--ease) both;animation-delay:calc(var(--k) * 70ms + .5s)}
@keyframes digit{0%{opacity:1;transform:none}60%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.4)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.2)}}
.orb .core{position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#FF8A64 0%,#E8452C 40%,rgba(206,46,27,0) 72%);opacity:0;transform:scale(.4)}
.slide.seen .orb .core{animation:core 1.2s var(--spring) 1.5s both,pulse 3.6s ease-in-out 2.7s infinite}
@keyframes core{to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.orb .orbit{position:absolute;inset:0;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .m{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;display:grid;place-items:center;font:italic 500 13px/1 var(--f-serif);color:var(--cream);background:rgba(12,6,7,.6);border:1px solid rgba(232,69,44,.35);transform:rotate(var(--a)) translateY(calc(min(250px,64vw) * -.44)) rotate(calc(var(--a) * -1));opacity:0}
.slide.seen .orb .m{animation:mon .8s var(--spring) both;animation-delay:calc(var(--k) * 90ms + 1.3s)}
@keyframes mon{from{opacity:0;transform:rotate(var(--a)) translateY(0) rotate(calc(var(--a) * -1)) scale(.3)}to{opacity:1}}

.peek{position:relative;width:min(290px,76vw);border-radius:22px;padding:22px 20px 22px;overflow:hidden;color:var(--cream);background:linear-gradient(180deg,rgba(23,10,11,.55),rgba(12,6,7,.92)),url(assets/rock.webp) center/cover;border:1px solid rgba(242,237,229,.14);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 60px rgba(206,46,27,.18);transform:rotate(-3deg)}
.slide.seen .peek{animation:peek 1.1s var(--spring) .2s both}
@keyframes peek{from{opacity:0;transform:translateY(40px) rotate(4deg)}to{opacity:1;transform:rotate(-3deg)}}
.peek .pm{font:500 10px/1 var(--f-text);letter-spacing:.36em;text-transform:uppercase;color:var(--cream-3)}
.peek h4{font:italic 500 26px/1.1 var(--f-serif);color:var(--scarlet);margin-top:12px}
.peek p{font:300 14px/1.6 var(--f-text);margin-top:10px;color:var(--cream-2)}
.peek .bl{filter:blur(4px);opacity:.6;user-select:none}
.peek .lockchip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;height:30px;padding:0 13px;border-radius:15px;border:1px solid rgba(232,69,44,.55);color:var(--cream);font:400 12px/1 var(--f-text)}
.peek .lockchip svg{width:13px;height:13px;color:var(--scarlet)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--hair);display:inline-flex;align-items:center;font:italic 500 16px/1 var(--f-serif);color:var(--cream)}

.route{width:min(300px,80vw);height:auto;overflow:visible}
.route path{fill:none;stroke:rgba(232,69,44,.8);stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900}
.slide.seen .route path{animation:dash 2.8s var(--ease) .3s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.route circle{fill:var(--cream);opacity:0}
.slide.seen .route circle{animation:star .5s ease forwards;animation-delay:calc(var(--k) * 180ms + .3s)}
@keyframes star{to{opacity:1}}
.route text{fill:var(--cream-3);font:italic 500 11px var(--f-serif);opacity:0}
.slide.seen .route text{animation:star .5s ease forwards;animation-delay:calc(var(--k) * 180ms + .45s)}
.author{display:flex;align-items:center;gap:12px;margin-top:18px}
.author .av{width:46px;height:46px;border-radius:50%;background:var(--red-grad);display:grid;place-items:center;font:italic 500 22px/1 var(--f-serif);flex-shrink:0;box-shadow:0 0 0 1px rgba(242,237,229,.2)}
.author .t{display:block;font:500 18px/1.2 var(--f-serif);color:var(--cream)}
.author .d{display:block;font:300 13px/1.4 var(--f-text);color:var(--cream-3);margin-top:2px}
.stat{margin-top:14px;font:italic 500 17px/1.35 var(--f-serif);color:var(--scarlet)}
.revs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px calc(var(--g) * -1) 0;padding:0 var(--g) 4px;scrollbar-width:none}
.revs::-webkit-scrollbar{display:none}
.rev{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;background:var(--glass);border:1px solid var(--hair);padding:14px 16px;font:italic 400 17px/1.35 var(--f-serif);color:var(--cream)}
.rev b{display:block;font:400 11px/1 var(--f-text);font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-3);margin-top:10px}

/* ---------- Кнопки ---------- */
.bottom{padding:16px var(--g) calc(18px + var(--safe-b));flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.btn{height:56px;border-radius:28px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;font:500 15px/1 var(--f-text);letter-spacing:.02em;transition:transform .15s ease,background .25s,border-color .25s}
.btn:active{transform:scale(.97);transition-duration:.05s}
button,[role=button],a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--red-grad);color:#fff;box-shadow:0 12px 34px rgba(206,46,27,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:disabled{background:var(--glass);color:var(--cream-3);box-shadow:none;transform:none;cursor:default}
.btn.white,.btn.line{background:rgba(12,6,7,.25);border:1px solid rgba(242,237,229,.55);color:var(--cream);font:400 19px/1 var(--f-serif);letter-spacing:.02em}
.btn.secondary{border:1px solid var(--hair);color:var(--cream)}
.btn.text{height:46px;color:var(--cream-2);font-weight:400}
.btn.split{justify-content:space-between;padding:0 26px;gap:12px}
.btn.split > span{white-space:nowrap}
.btn svg{width:20px;height:20px}

/* ---------- 3. Регистрация ---------- */
.bar{height:60px;margin-top:var(--safe-t);padding:0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--cream);flex-shrink:0;margin-left:-10px;transition:background .2s}
.ib:active{background:var(--glass-2)}
.ib svg{width:22px;height:22px}
.ib.ghost{margin-left:0}
.spacer{width:44px}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:2px;border-radius:1px;background:var(--hair);transition:background .4s}
.steps i.on{background:var(--scarlet)}
.form{padding:20px var(--g) 0}
.field{margin-top:40px}
.uline{width:100%;height:62px;border:0;border-bottom:1px solid rgba(242,237,229,.3);padding:0;font:400 34px/1 var(--f-serif);color:var(--cream);outline:none;background:transparent;border-radius:0;transition:border-color .3s;caret-color:var(--scarlet)}
.uline:focus{border-color:var(--scarlet)}
.uline::placeholder{color:var(--cream-3);font-style:italic}
.gbig{display:flex;flex-direction:column;gap:12px}
.gbig button{height:78px;border-radius:20px;border:1px solid var(--hair);background:var(--glass);padding:0 24px;display:flex;align-items:center;justify-content:space-between;font:400 26px/1 var(--f-serif);transition:background .25s,border-color .25s,transform .15s}
.gbig button:active{transform:scale(.99)}
.gbig button svg{width:22px;height:22px;opacity:.5}
.gbig button.on{border-color:var(--scarlet);background:rgba(232,69,44,.12);color:var(--scarlet)}
.wheels{position:relative;display:grid;grid-template-columns:.7fr 1.45fr 1fr;gap:6px;height:220px;margin-top:30px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-top:1px solid rgba(232,69,44,.5);border-bottom:1px solid rgba(232,69,44,.5);pointer-events:none}
.wh{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;perspective:600px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 32%,#000 68%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 32%,#000 68%,transparent 100%);overscroll-behavior:contain}
.wh::-webkit-scrollbar{display:none}
.wpad{height:88px}
.wi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font:400 24px/1 var(--f-serif);color:var(--cream-3);cursor:pointer;transform-origin:50% 50% -60px;transition:color .15s}
.wi.on{color:var(--cream)}
.wlab{display:grid;grid-template-columns:.7fr 1.45fr 1fr;gap:6px;margin-top:26px;text-align:center;font:500 10px/1 var(--f-text);letter-spacing:.32em;text-transform:uppercase;color:var(--cream-3)}
.hintc{display:flex;gap:12px;margin-top:22px;padding:16px 18px;border-radius:18px;border:1px solid var(--hair);background:var(--glass);font:300 14px/1.55 var(--f-text);color:var(--cream-2)}
.hintc svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--scarlet)}
.hintc b{color:var(--cream);font-weight:500}
.ccard{margin-top:28px;border-radius:24px;border:1px solid var(--hair);background:var(--glass);padding:22px 22px 24px}
.ccard .row{display:flex;justify-content:space-between;gap:12px;font:300 15px/1.4 var(--f-text);color:var(--cream-3)}
.ccard .row + .row{margin-top:12px}
.ccard .row b{color:var(--cream);font-weight:400}
.ccard .bigl{font:500 10px/1 var(--f-text);letter-spacing:.36em;text-transform:uppercase;color:var(--cream-3);margin-top:22px;padding-top:20px;border-top:1px solid var(--hair)}
.ccard .big{font:italic 400 clamp(32px,10vw,40px)/1.1 var(--f-serif);color:var(--scarlet);margin-top:10px}
.note{margin-top:16px;font:300 14px/1.5 var(--f-text);color:var(--cream-3)}

/* ---------- 4. Тарифы ---------- */
.urg{display:flex;align-items:center;gap:10px;margin-top:16px;font:italic 500 18px/1.35 var(--f-serif);color:var(--cream)}
.urg svg{width:18px;height:18px;flex-shrink:0;color:var(--scarlet)}
.plans{display:flex;flex-direction:column;gap:12px;padding:26px var(--g) 0}
.plan{position:relative;width:100%;min-height:96px;border-radius:22px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;transition:transform .15s ease;overflow:hidden;border:1px solid var(--hair);background:var(--glass);color:var(--cream)}
.plan:active{transform:scale(.985)}
.plan .n{display:block;font:500 23px/1.1 var(--f-serif)}
.plan .s{display:block;font:300 13px/1.45 var(--f-text);color:var(--cream-3);margin-top:6px}
.plan .p{font:400 30px/1 var(--f-serif);white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.plan .p small{font:400 12px/1 var(--f-text);letter-spacing:.1em;color:var(--cream-3)}
.plan .p svg{width:16px;height:16px;align-self:center;color:var(--cream-3)}
.plan.p1{border-color:rgba(232,69,44,.75);background:linear-gradient(160deg,rgba(206,46,27,.32),rgba(122,16,22,.18)),url(assets/rock.webp) center 70%/cover;background-blend-mode:normal,soft-light;box-shadow:0 18px 50px rgba(206,46,27,.25)}
.plan.p1 .n,.plan.p1 .p{color:var(--cream)}
.plan.p1 .s{color:var(--cream-2)}
.plan.p1::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,230,215,.18),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out 1.4s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.badge{display:inline-block;margin-bottom:10px;height:22px;padding:0 10px;border-radius:11px;background:var(--scarlet);color:#fff;font:500 9px/22px var(--f-text);letter-spacing:.24em;text-transform:uppercase}
.plan.p3{opacity:.6}
.plan.done{cursor:default}
.pill{height:30px;padding:0 13px;border-radius:15px;display:inline-flex;align-items:center;font:400 12px/1 var(--f-text);letter-spacing:.04em;white-space:nowrap}
.pill.ok{border:1px solid rgba(143,211,168,.45);color:var(--ok)}
.pill.buy{background:var(--red-grad);color:#fff;height:34px;padding:0 16px;border-radius:17px}
.extra{display:flex;flex-direction:column;gap:10px;padding:16px var(--g) 8px}
.promo-btn{position:relative;overflow:hidden;width:100%;height:56px;border-radius:28px;border:1px dashed rgba(232,69,44,0);background:rgba(232,69,44,.1);display:flex;align-items:center;justify-content:center;gap:10px;font:400 15px/1 var(--f-text);color:var(--cream)}
.promo-btn svg{width:20px;height:20px;color:var(--scarlet);position:relative}
.promo-btn span{position:relative}
.promo-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,200,180,.22),transparent);transform:skewX(-18deg);animation:shine 3.6s ease-in-out 1.2s infinite}
.promo-ok{margin:16px var(--g) 0;font:italic 500 18px/1.4 var(--f-serif);color:var(--ok)}

/* ---------- 5. Оплата ---------- */
.failw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px}
.failw .ic{width:84px;height:84px;border-radius:50%;border:1px solid rgba(232,69,44,.6);color:var(--scarlet);display:grid;place-items:center;animation:shake .6s ease .2s both}
.failw .ic svg{width:36px;height:36px}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.failw h1{font:400 36px/1.1 var(--f-serif);color:var(--scarlet);margin-top:28px}
.failw p{font:300 16px/1.55 var(--f-text);color:var(--cream-2);margin-top:12px}

.success .sbg{position:absolute !important;z-index:0 !important;left:0;right:0;bottom:0;height:62%;background:url(assets/goat-sun.webp) 62% 70%/cover;opacity:0;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%);mask-image:linear-gradient(180deg,transparent 0%,#000 55%);animation:sbg 2.6s ease .3s forwards;filter:brightness(.55) saturate(1.1)}
@keyframes sbg{to{opacity:.55}}
.success .stagew{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px}
.sfan{position:relative;width:100%;height:150px;margin-bottom:4px}
.sc{position:absolute;left:50%;top:26px;width:48px;height:72px;margin-left:-24px;transform-origin:50% 330%;perspective:500px;animation:fanout 1.1s var(--spring) both;animation-delay:calc(.25s + var(--k) * 35ms)}
@keyframes fanout{from{opacity:0;transform:translateY(60px) rotate(0) scale(.5)}to{opacity:1;transform:rotate(var(--a))}}
.sc .fi{animation:flip .9s var(--spring) both;animation-delay:calc(1.15s + var(--k) * 70ms)}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.sc .ff,.sc .fb{border-radius:10px}
.sc .ff{padding:6px 4px;justify-content:center;align-items:center}
.sc .ff .fm{font-size:13px}
.sc .fb svg{width:16px;height:16px}
.okmark{position:relative;width:92px;height:92px;margin-top:-6px}
.okmark::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(232,69,44,.2);animation:okpulse 1.8s var(--ease) 2.3s both}
.okmark svg{position:relative;width:100%;height:100%;fill:none;stroke:var(--cream);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.okmark .c{stroke:var(--scarlet);stroke-dasharray:277;stroke-dashoffset:277;animation:draw .8s var(--ease) 1.9s forwards}
.okmark .k{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s var(--ease) 2.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes okpulse{0%{transform:scale(.6);opacity:0}40%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:2px;height:14px;margin:-7px 0 0 -1px;border-radius:1px;background:linear-gradient(#FFD7C2,#E8452C);opacity:0;transform:rotate(var(--a)) translateY(-40px);animation:spark 1s var(--ease) 2.55s both}
@keyframes spark{0%{opacity:0;transform:rotate(var(--a)) translateY(-40px) scaleY(.4)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-90px) scaleY(1)}}
.success h1{font:400 44px/1.05 var(--f-serif);color:var(--scarlet);margin-top:20px;animation:rise .8s var(--ease) 2.7s both}
.success .stagew > p{font:300 16px/1.6 var(--f-text);color:var(--cream-2);margin-top:12px;max-width:310px;animation:rise .8s var(--ease) 2.85s both}
.tghint{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:22px;padding:14px 16px;border-radius:18px;background:rgba(12,6,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--hair);font:300 14px/1.5 var(--f-text);color:var(--cream-2);max-width:330px;animation:rise .8s var(--ease) 3s both}
.tghint svg{width:20px;height:20px;flex-shrink:0;color:var(--scarlet)}
.success .bottom .btn{animation:rise .8s var(--ease) 3.15s both}

/* ---------- 6. Главный экран: шапка и веер карт ---------- */
.night{flex-shrink:0;padding:calc(var(--safe-t) + 4px) var(--g) 18px;overflow:hidden}
.night .stars{transform:translateY(calc(var(--c,0) * -24px))}
.night .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:52px}
.prof{height:38px;padding:0 14px 0 10px;margin-right:-6px;border-radius:19px;display:flex;align-items:center;gap:8px;border:1px solid var(--hair);background:var(--glass);font:400 13px/1 var(--f-text);color:var(--cream)}
.prof svg{width:18px;height:18px}
.mtabs{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;margin-top:6px;border-bottom:1px solid var(--hair)}
.mtabs button{position:relative;height:42px;font:400 21px/1 var(--f-serif);color:var(--cream-3);transition:color .25s}
.mtabs button.on{color:var(--scarlet);font-style:italic}
.mtabs button.on::after{content:"";position:absolute;left:34%;right:34%;bottom:-1px;height:1px;background:var(--scarlet);animation:tabin .5s var(--spring)}
@keyframes tabin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dpill{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font:500 10px/1.4 var(--f-text);letter-spacing:.2em;text-transform:uppercase;color:var(--scarlet);white-space:nowrap}
@media (max-width:380px){ .dpill{letter-spacing:.1em} }
.dpill svg{width:13px;height:13px}
.fanwrap{position:relative;z-index:2;height:calc(214px - 112px * var(--c,0));-webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 98%);mask-image:linear-gradient(180deg,#000 74%,transparent 98%);margin:4px calc(var(--g) * -1) 0;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.fanwrap:active{cursor:grabbing}
.fan{position:absolute;inset:0;transform:scale(calc(1 - .48 * var(--c,0)));transform-origin:50% 8px}
.fc{position:absolute;left:50%;top:12px;width:110px;height:160px;margin-left:-55px;transform-origin:50% 560%;perspective:800px;will-change:transform,opacity}
.fan.snap .fc{transition:transform .7s var(--spring),opacity .45s ease,filter .45s ease}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s var(--spring)}
.fc.lk .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.ff{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 8px 12px;color:var(--cream);border:1px solid rgba(242,237,229,.28);background:linear-gradient(180deg,rgba(12,6,7,.5) 0%,rgba(12,6,7,.3) 45%,rgba(12,6,7,.85) 100%),url(assets/rock.webp) var(--bp,50% 50%)/260% auto;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.fn{font:500 9px/1 var(--f-text);letter-spacing:.3em;color:rgba(242,237,229,.8)}
.fm{font:italic 500 23px/1 var(--f-serif);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.fd{font:400 10px/1 var(--f-text);letter-spacing:.08em;color:rgba(242,237,229,.8)}
.fb{transform:rotateY(180deg);background:radial-gradient(ellipse at 50% 120%,rgba(206,46,27,.45),rgba(206,46,27,0) 60%),linear-gradient(180deg,#1E0B0D,#120708);border:1px solid rgba(232,69,44,.35);display:grid;place-items:center;color:rgba(232,69,44,.85);box-shadow:0 14px 34px rgba(0,0,0,.55)}
.fb::before{content:"";position:absolute;inset:7px;border-radius:12px;border:1px solid rgba(242,237,229,.1)}
.fb svg{width:28px;height:28px}
.fb .lkm{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;color:var(--cream-3)}
.fb .lkm svg{width:13px;height:13px}
.fc.cur .ff{border-color:rgba(232,69,44,.9);box-shadow:0 0 0 1px rgba(232,69,44,.6),0 18px 44px rgba(206,46,27,.45)}
.fc.cur .fb{border-color:rgba(232,69,44,.8);box-shadow:0 18px 44px rgba(206,46,27,.4)}
.hph{position:relative;z-index:3;text-align:center;font:italic 400 18px/1.35 var(--f-serif);color:var(--cream-2);margin:calc(2px * (1 - var(--c,0))) auto 0;max-width:300px;opacity:calc(1 - 1.4 * var(--c,0));max-height:calc(4em * (1 - var(--c,0)));overflow:hidden}
.night .ytl{position:relative;z-index:2;font:italic 400 52px/1 var(--f-serif);color:var(--scarlet);margin-top:calc(20px - 10px * var(--c,0))}
.night .ytl + .hph{text-align:left;margin-left:0;font-style:normal;font:300 14px/1.5 var(--f-text);letter-spacing:.02em;color:var(--cream-3)}
.rprog{position:absolute;left:24px;right:24px;bottom:6px;height:1px;background:var(--hair);pointer-events:none;z-index:2}
.rprog i{display:block;height:100%;background:var(--scarlet);transform-origin:left;transform:scaleX(0)}
.main .scroll{border-top:0}

.content{padding:14px 16px 32px;display:flex;flex-direction:column;gap:12px}
.sec{border-radius:22px;padding:24px 22px 24px;border:1px solid var(--hair);background:linear-gradient(180deg,rgba(255,236,226,.05),rgba(255,236,226,.025))}
.sec h3{font:500 25px/1.15 var(--f-serif);color:var(--scarlet);display:flex;align-items:center;gap:8px}
.txt{margin-top:12px;font:300 16px/1.7 var(--f-text);color:var(--cream)}
.txt p + p{margin-top:12px}
.txt b{font-weight:500;color:#fff}
.txt ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.txt li{position:relative;padding-left:22px}
.txt li::before{content:"";position:absolute;left:0;top:.82em;width:10px;height:1px;background:var(--scarlet)}
.sec-h{display:block;width:100%;text-align:left}
.fold .tw{position:relative;max-height:9.2em;overflow:hidden;transition:max-height .6s var(--ease)}
.fold.short .tw{max-height:none}
.more{margin-top:4px;margin-bottom:-8px;min-height:44px;font:italic 500 17px/1 var(--f-serif);color:var(--scarlet);display:inline-flex;align-items:center}
.fold.short .more{display:none}
.sec.rv{opacity:0;transform:translateY(48px) scale(.95);transform-origin:50% 0;filter:blur(6px)}
.sec.rv-in{opacity:1;transform:none;filter:none;transition:opacity .8s ease,transform 1s var(--spring),filter .8s ease;transition-delay:var(--rd,0ms)}
.sec.lock{background:transparent;border-style:dashed;border-color:rgba(242,237,229,.12)}
.sec.lock h3{color:var(--cream-3)}
.sec.lock h3 svg{width:16px;height:16px}
.sec.lock p{color:var(--cream-3);font:300 13px/1.4 var(--f-text);margin-top:8px}
.closed{padding:18px 6px;text-align:center}
.closed .t{font:italic 400 28px/1.2 var(--f-serif);color:var(--scarlet)}
.closed .d{font:300 15px/1.55 var(--f-text);color:var(--cream-2);margin-top:10px}
.nextm{height:62px;border-radius:31px;border:1px solid rgba(242,237,229,.4);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:italic 400 21px/1 var(--f-serif);color:var(--cream)}
.nextm svg{width:22px;height:22px;color:var(--scarlet)}
.ybanner{position:relative;overflow:hidden;border-radius:24px;padding:26px 22px 22px;border:1px solid rgba(232,69,44,.5);background:linear-gradient(90deg,rgba(12,6,7,.94) 0%,rgba(12,6,7,.7) 60%,rgba(12,6,7,.35) 100%),url(assets/goat-sun.webp) 40% 52%/cover}
.ybanner .k{font:500 10px/1 var(--f-text);letter-spacing:.36em;text-transform:uppercase;color:var(--cream-2)}
.ybanner .t{font:400 28px/1.12 var(--f-serif);color:var(--cream);margin-top:12px}
.ybanner .t em{color:var(--scarlet)}
.ybanner .btn{margin-top:18px;height:52px}
.yq{font:italic 400 30px/1.15 var(--f-serif);color:var(--cream);padding:8px 4px 6px;text-align:center}
.ycards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yc{position:relative;height:230px;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--cream);overflow:hidden;border:1px solid rgba(242,237,229,.22);transition:transform .2s,border-color .25s}
.yc:active{transform:scale(.98);border-color:var(--scarlet)}
.yc.w{background:linear-gradient(180deg,rgba(12,6,7,.05),rgba(12,6,7,.85)),url(assets/rock.webp) 30% 40%/240% auto}
.yc.l{background:linear-gradient(180deg,rgba(12,6,7,.05),rgba(12,6,7,.85)),url(assets/goat-sun.webp) 30% 52%/300% auto}
.yc svg{width:28px;height:28px;color:var(--cream)}
.yc .n{display:block;font:italic 500 28px/1.05 var(--f-serif)}
.yc .d{display:block;font:300 12px/1.45 var(--f-text);color:var(--cream-2);margin-top:6px}
.yseg{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--hair)}
.yseg button{position:relative;height:48px;font:400 21px/1 var(--f-serif);color:var(--cream-3)}
.yseg button.on{color:var(--scarlet);font-style:italic}
.yseg button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:1px;background:var(--scarlet)}

/* ---------- 7. Профиль ---------- */
.lsw{display:flex;gap:2px;margin-right:-8px}
.lsw button{min-width:40px;height:44px;font:500 11px/1 var(--f-text);color:var(--cream-3);letter-spacing:.2em}
.lsw button.on{color:var(--scarlet)}
.me{display:flex;align-items:center;gap:18px;padding:12px var(--g) 8px}
.ava{width:76px;height:76px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font:italic 400 34px/1 var(--f-serif);overflow:hidden;color:var(--cream);background:linear-gradient(180deg,rgba(12,6,7,.2),rgba(12,6,7,.5)),url(assets/rock.webp) center/cover;box-shadow:0 0 0 1px rgba(232,69,44,.6)}
.ava img{width:100%;height:100%;object-fit:cover}
.me .nm{font:400 36px/1.05 var(--f-serif);color:var(--scarlet)}
.me .sub{font:300 14px/1.5 var(--f-text);color:var(--cream-3);margin-top:8px}
.group{padding:0 var(--g);margin-top:30px}
.group > .eyebrow{display:block;margin-bottom:12px}
.list{border-top:1px solid var(--hair)}
.item{width:100%;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--hair);font:400 20px/1.2 var(--f-serif);text-align:left;color:var(--cream)}
.item[role=button]{cursor:pointer}
.item .who{display:flex;align-items:center;gap:14px}
.item .dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(242,237,229,.35);display:grid;place-items:center;flex-shrink:0}
.item .dot.on{border-color:var(--scarlet);background:var(--scarlet);color:#fff}
.item .dot svg{width:11px;height:11px}
.item.act{justify-content:flex-start;gap:14px;color:var(--scarlet)}
.item.act svg{width:20px;height:20px}
.item.act.ink{color:var(--cream)}
.linkb{display:block;margin:30px auto 0;min-height:44px;padding:0 16px;font:italic 500 19px/1 var(--f-serif);color:var(--scarlet)}
.proto{display:block;margin:6px auto 0;min-height:44px;padding:0 16px;font:400 12px/1 var(--f-text);color:var(--cream-3)}

/* ---------- Шторки ---------- */
.ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(5,2,3,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s ease;z-index:20}
.ov.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1E0C0E,#110708);border-top:1px solid var(--hair);border-radius:26px 26px 0 0;z-index:21;transform:translateY(100%);transition:transform .45s var(--ease);max-height:88%;display:flex;flex-direction:column;color:var(--cream)}
.sheet.in{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:18px var(--g) 4px 24px}
.sh-head .t{font:400 26px/1.15 var(--f-serif);color:var(--scarlet)}
.sh-body{padding:8px var(--g);overflow-y:auto}
.sh-body p{font:300 15px/1.6 var(--f-text);color:var(--cream-2)}
.sh-body p + p{margin-top:8px}
.amount{font:300 60px/1 var(--f-serif);margin:16px 0;color:var(--cream)}
.amount small{font:400 14px/1 var(--f-text);letter-spacing:.12em;margin-left:8px;color:var(--cream-3)}
.paynote{display:flex;gap:12px;padding:16px 18px;border-radius:18px;border:1px solid var(--hair);background:var(--glass);font:300 14px/1.55 var(--f-text);color:var(--cream-2)}
.paynote svg{width:20px;height:20px;flex-shrink:0;color:var(--scarlet)}
.err{font:400 14px/1.4 var(--f-text);color:var(--scarlet);margin-top:10px;min-height:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--hair);border-radius:14px;padding:3px;gap:3px}
.seg button{height:40px;border-radius:11px;font:400 13px/1 var(--f-text);color:var(--cream-3)}
.seg button.on{background:rgba(232,69,44,.2);color:var(--cream)}
.gear-row{margin-top:18px}
.label{font:500 10px/1 var(--f-text);letter-spacing:.3em;text-transform:uppercase;color:var(--cream-3);display:block;margin-bottom:10px}

/* ---------- Адаптивность ---------- */
@media (max-width:359px){
  :root{--g:20px}
  .btn{font-size:14px}
  .h1{font-size:30px}
  .lq{font-size:36px}
  .plan{padding-left:18px;padding-right:18px}

  .plan .p{font-size:25px}
  .fc{width:98px;height:144px;margin-left:-49px}

  .dpill{letter-spacing:.06em;font-size:9px}
}
@media (max-height:700px){
  .lwrap{padding-top:calc(var(--safe-t) + 34px)}
  .field{margin-top:26px}
  .wheels{margin-top:14px}
  .bar{height:52px}
  .onb .top{height:50px}
  .otx p{font-size:15px;margin-top:8px}
  .orb{width:min(200px,56vw)}
  .orb .m{transform:rotate(var(--a)) translateY(calc(min(200px,56vw) * -.44)) rotate(calc(var(--a) * -1))}
  .ill{min-height:150px}
  .slide[data-k="2"] .ill{flex:0 0 auto;min-height:0;padding:14px 0 10px}
  .revs{display:none}
  .bottom{padding-top:10px;padding-bottom:calc(12px + var(--safe-b))}
  .btn.text{height:40px}
  .sfan{height:126px}
  .success h1{margin-top:12px;font-size:38px}
  .tghint{margin-top:14px}
  .ccard{margin-top:18px;padding:18px}
  .fanwrap{height:calc(180px - 90px * var(--c,0))}
  .fc{width:96px;height:138px;margin-left:-48px}
  .fm{font-size:20px}
}

/* ===================== v4: светлая небесная тема =====================
   Небесный #A9C5DA, морской #315A7C, алый #B7352A, рассвет #F2D3BA, молочный #F5EBDD.
   Заголовки и текст молочные, курсивные акценты рассветные, алый для главных кнопок и выгодного тарифа. */
:root{
  --sky:#A9C5DA; --sea:#315A7C; --alyi:#B7352A; --dawn:#F2D3BA; --milk:#F5EBDD; --sea-ink:#23415C;
  --bg0:#315A7C;
  --scarlet:#F5EBDD;
  --cream:#F5EBDD;
  --cream-2:rgba(245,235,221,.86);
  --cream-3:rgba(245,235,221,.66);
  --hair:rgba(245,235,221,.34);
  --glass:rgba(245,235,221,.13);
  --glass-2:rgba(245,235,221,.22);
  --ok:#E6F7EC;
  --red-grad:radial-gradient(ellipse at 75% 120%,#D9573F 0%,#B7352A 50%,#7E1E18 100%);
}
body{background:var(--sea)}
#app{background:var(--sea)}
@media (min-width:600px){ body{background:#10233A} body.tg{background:var(--sea)} }
.screen{background:
  radial-gradient(70% 34% at 50% 58%,rgba(242,211,186,.42) 0%,rgba(242,211,186,0) 70%),
  linear-gradient(180deg,#86A8C5 0%,#7FA2C0 30%,#5D85A8 62%,#3F6890 84%,#315A7C 100%)}
.h1,.lq,.otx h2,.failw h1,.success h1,.me .nm,.night .ytl,.closed .t,.sh-head .t{text-shadow:0 1px 22px rgba(35,65,92,.35)}
.h1 em,.otx h2 em,.ybanner .t em{color:var(--dawn)}
.lq span{color:rgba(245,235,221,.7)}
.eyebrow{color:rgba(245,235,221,.8)}
.rockbg{opacity:.42;height:24%;filter:saturate(1.05) brightness(1.05);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%);mask-image:linear-gradient(180deg,transparent 0%,#000 55%)}
.dust i{background:rgba(255,246,232,.95);box-shadow:0 0 8px rgba(255,236,210,.9)}
.glow.a{background:radial-gradient(closest-side,rgba(255,232,206,.55),rgba(255,232,206,0))}
.glow.b{background:radial-gradient(closest-side,rgba(242,211,186,.35),rgba(242,211,186,0))}
.dk-btn .code{color:var(--milk)}
.dk-btn{background:rgba(245,235,221,.16)}
/* онбординг */
.orb .ring.r2{border-color:rgba(242,211,186,.5)}
.orb .core{background:radial-gradient(circle,#FFFBF3 0%,#F2D3BA 40%,rgba(242,211,186,0) 72%)}
.orb .m{background:rgba(49,90,124,.5);border-color:rgba(245,235,221,.45)}
.peek{background:linear-gradient(180deg,rgba(245,235,221,.96),rgba(242,226,208,.92));color:var(--sea-ink);border-color:rgba(255,255,255,.6);box-shadow:0 30px 60px rgba(35,65,92,.35)}
.peek .pm{color:rgba(35,65,92,.6)}
.peek h4{color:var(--alyi)}
.peek p{color:rgba(35,65,92,.85)}
.peek .lockchip{border-color:rgba(183,53,42,.5);color:var(--sea-ink)}
.peek .lockchip svg{color:var(--alyi)}
.route path{stroke:rgba(242,211,186,.95)}
.stat{color:var(--dawn)}
.rev{background:rgba(245,235,221,.16)}
.dots i{background:rgba(245,235,221,.4)}
/* кнопки и поля */
.btn.white,.btn.line{background:rgba(245,235,221,.14);border-color:rgba(245,235,221,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn.primary{box-shadow:0 12px 30px rgba(126,30,24,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary:disabled{background:rgba(245,235,221,.2);color:rgba(245,235,221,.6)}
.wheels::before{border-color:rgba(245,235,221,.6);background:rgba(245,235,221,.1);border-radius:0}
.gbig button.on{background:rgba(245,235,221,.24);border-color:var(--milk);color:var(--milk)}
.hintc svg,.paynote svg,.urg svg{color:var(--dawn)}
.err{color:#FFD9CF}
/* тарифы */
.plan{background:rgba(245,235,221,.13);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.plan.p1{border-color:rgba(245,235,221,.55);background:linear-gradient(160deg,rgba(183,53,42,.92),rgba(126,30,24,.9)),url(assets/rock.webp) center 70%/cover;background-blend-mode:normal,overlay;box-shadow:0 18px 44px rgba(126,30,24,.32)}
.badge{background:var(--milk);color:var(--alyi)}
.pill.ok{border-color:rgba(230,247,236,.7)}
.promo-btn{background:rgba(245,235,221,.16)}
.promo-btn svg{color:var(--dawn)}
.promo-ok{color:var(--milk)}
/* оплата */
.failw .ic{border-color:rgba(245,235,221,.7);color:var(--milk)}
.success .sbg{filter:none;height:46%;background-position:18% 78%}
@keyframes sbg{to{opacity:.8}}
.success .stagew > p,.tghint{text-shadow:0 1px 12px rgba(35,65,92,.4)}
.okmark::before{background:rgba(242,211,186,.35)}
.okmark .c{stroke:var(--milk)}
.spark{background:linear-gradient(#FFFFFF,#F2D3BA)}
.tghint{background:rgba(49,90,124,.55)}
.tghint svg{color:var(--dawn)}
/* главный экран: веер карт с морем и закатом */
.night .stars i{background:#FFF7EA}
.mtabs button.on::after,.yseg button.on::after{background:var(--milk)}
.dpill{color:var(--milk)}
.ff{color:var(--sea-ink);border-color:rgba(255,255,255,.75);background:linear-gradient(180deg,rgba(245,235,221,.35) 0%,rgba(245,235,221,0) 45%,rgba(49,90,124,.25) 100%),url(assets/goat-sun.webp) var(--bp,30% 40%)/360% auto;box-shadow:0 14px 34px rgba(35,65,92,.35)}
.fn{color:rgba(35,65,92,.75)}
.fm{text-shadow:0 1px 10px rgba(245,235,221,.7)}
.fd{color:rgba(35,65,92,.8)}
.fb{background:linear-gradient(180deg,rgba(245,235,221,.32),rgba(245,235,221,.12));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.55);color:var(--milk);box-shadow:0 14px 34px rgba(35,65,92,.3)}
.fb::before{border-color:rgba(255,255,255,.3)}
.fc.cur .ff{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7),0 18px 44px rgba(242,211,186,.6)}
.fc.cur .fb{border-color:#fff;box-shadow:0 18px 44px rgba(242,211,186,.5)}
.rprog i{background:var(--milk)}
/* блоки прогноза */
.sec{background:linear-gradient(180deg,rgba(245,235,221,.17),rgba(245,235,221,.09));border-color:rgba(245,235,221,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sec h3{color:var(--milk)}
.txt li::before{background:var(--dawn)}
.more{color:var(--dawn)}
.nextm svg{color:var(--dawn)}
.ybanner{border-color:rgba(245,235,221,.6);background:linear-gradient(90deg,rgba(35,65,92,.92) 0%,rgba(49,90,124,.7) 65%,rgba(49,90,124,.35) 100%),url(assets/goat-sun.webp) 10% 40%/cover}
.yc{border-color:rgba(255,255,255,.55)}
.yc.w{background:linear-gradient(180deg,rgba(35,65,92,0),rgba(35,65,92,.8)),url(assets/rock.webp) 30% 40%/240% auto}
.yc.l{background:linear-gradient(180deg,rgba(35,65,92,0),rgba(35,65,92,.8)),url(assets/goat-sun.webp) 30% 52%/300% auto}
/* профиль и шторки */
.ava{box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.item.act{color:var(--dawn)}
.linkb{color:var(--dawn)}
.item .dot.on{border-color:var(--milk);background:var(--milk);color:var(--sea)}
.ov{background:rgba(20,40,60,.4)}
.sheet{background:linear-gradient(180deg,#5D85A8,#3F6890);border-top-color:rgba(245,235,221,.4)}
.seg button.on{background:rgba(245,235,221,.25)}

/* ===================== v26: без дымки, контрастный текст, яркие алые акценты =====================
   Фон чище и глубже, без светлого свечения посередине. Читаемый текст лежит на молочных карточках
   (тёмно-морской текст, алые заголовки). Алый #D33A28 на кнопках, активных картах, вкладках, точках. */
:root{
  --cream-2:rgba(245,235,221,.96);
  --cream-3:rgba(245,235,221,.86);
  --hair:rgba(245,235,221,.5);
  --alyi:#D33A28; --alyi-l:#EE5A40; --card:#F8F1E7; --ink2:#23415C; --ink3:rgba(35,65,92,.72);
  --red-grad:radial-gradient(ellipse at 75% 120%,#F26245 0%,#D33A28 45%,#9E2419 100%);
}
.screen{background:linear-gradient(180deg,#5B86AF 0%,#4A77A2 34%,#3A6792 68%,#2A5379 100%)}
.screen.fade{transform:none;transition:opacity .45s ease}
.glow{display:none}
.dust{opacity:.45}
.rockbg{opacity:.9;height:18%;filter:saturate(1.15)}
.h1,.lq,.otx h2,.failw h1,.success h1,.me .nm,.night .ytl,.closed .t{text-shadow:0 1px 14px rgba(20,45,70,.28)}
.eyebrow{color:rgba(245,235,221,.92)}
.h1 em,.otx h2 em,.ybanner .t em{color:#FFD9BF}

/* Молочные карточки */
.sec,.plan,.ccard,.hintc,.dk-btn,.gbig button,.list,.rev,.tghint{background:var(--card);color:var(--ink2);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 10px 28px rgba(16,40,64,.18)}
.sec h3{color:var(--alyi)}
.txt{color:var(--ink2)}
.txt b{color:#142C44}
.txt li::before{background:var(--alyi)}
.more{color:var(--alyi)}
.sec.lock{background:rgba(248,241,231,.16);border:1px dashed rgba(245,235,221,.7);box-shadow:none}
.sec.lock h3,.sec.lock p{color:rgba(245,235,221,.92)}
.plan .n{color:var(--ink2)}
.plan .s,.plan .p small{color:var(--ink3)}
.plan .p{color:var(--ink2)}
.plan .p svg{color:var(--ink3)}
.plan.p1{background:var(--red-grad)}
.plan.p1 .n,.plan.p1 .p{color:#fff}
.plan.p1 .s,.plan.p1 .p small{color:rgba(255,255,255,.85)}
.badge{background:#fff;color:var(--alyi)}
.plan.p3{opacity:.8}
.pill.ok{border:1px solid rgba(30,122,71,.45);color:#1E7A47}
.ccard .row{color:var(--ink3)}
.ccard .row b{color:var(--ink2)}
.ccard .bigl{color:var(--ink3);border-top-color:rgba(35,65,92,.14)}
.ccard .big{color:var(--alyi)}
.hintc{color:var(--ink3)}
.hintc b{color:var(--ink2)}
.hintc svg,.tghint svg{color:var(--alyi)}
.dk-btn .n{color:var(--ink2)}
.dk-btn .d{color:var(--ink3)}
.dk-btn .code{color:var(--alyi);border-color:rgba(211,58,40,.4)}
.gbig button svg{color:var(--alyi);opacity:1}
.gbig button.on{background:var(--red-grad);color:#fff}
.gbig button.on svg{color:#fff}
.list{border-radius:20px;padding:0 16px}
.item{color:var(--ink2);border-bottom:1px solid rgba(35,65,92,.12)}
.list > :last-child{border-bottom:0}
.item.act{color:var(--alyi)}
.item.act.ink{color:var(--ink2)}
.item .dot{border-color:rgba(35,65,92,.3)}
.item .dot.on{background:var(--alyi);border-color:var(--alyi);color:#fff}
.rev{color:var(--ink2)}
.rev b{color:var(--ink3)}
.tghint{color:var(--ink2);text-shadow:none}
.promo-btn{background:var(--card);color:var(--ink2)}
.promo-btn svg{color:var(--alyi)}
.promo-btn::after{background:linear-gradient(100deg,transparent,rgba(211,58,40,.16),transparent)}

/* Алые акценты на небе */
.steps i.on,.dots i.on{background:var(--alyi-l)}
.mtabs button.on::after,.yseg button.on::after{background:var(--alyi-l);height:2px}
.rprog i{background:var(--alyi-l)}
.wheels::before{border-color:var(--alyi-l);background:rgba(245,235,221,.12)}
.dpill{display:inline-flex;margin:8px auto 0;height:28px;padding:0 14px;border-radius:14px;background:var(--red-grad);color:#fff;letter-spacing:.14em}
.night{text-align:center}
.night .top{text-align:left}
.fc.cur .ff{border-color:var(--alyi-l);box-shadow:0 0 0 2px var(--alyi-l),0 16px 40px rgba(211,58,40,.4)}
.fc.cur .fb{border-color:var(--alyi-l);box-shadow:0 0 0 2px var(--alyi-l),0 16px 40px rgba(211,58,40,.35)}
.fn{color:var(--alyi)}
.failw .ic{background:var(--red-grad);border:0;color:#fff}
.okmark .c{stroke:var(--alyi-l)}
.okmark::before{background:rgba(238,90,64,.3)}
.intro .ttl h1 em{color:#fff}
.author .t{color:#fff}
.stat{color:#FFD9BF}
.urg svg{color:#FFD9BF}
.uline{border-bottom-color:rgba(245,235,221,.6)}
.uline:focus{border-bottom-color:var(--alyi-l)}

/* Шторки: молочные, текст тёмный, заголовки алые */
.sheet{background:var(--card);color:var(--ink2);border-top:0}
.sh-head .t{color:var(--alyi);text-shadow:none}
.sheet .ib{color:var(--ink2)}
.sh-body p{color:var(--ink3)}
.amount{color:var(--ink2)}
.amount small{color:var(--ink3)}
.paynote{background:#fff;color:var(--ink3);border:0}
.paynote svg{color:var(--alyi)}
.sheet .uline{color:var(--ink2);border-bottom-color:rgba(35,65,92,.3)}
.sheet .uline::placeholder{color:rgba(35,65,92,.45)}
.sheet .err{color:var(--alyi)}
.sheet .btn.secondary{border-color:rgba(35,65,92,.3);color:var(--ink2)}
.sheet .seg{border-color:rgba(35,65,92,.2)}
.sheet .seg button{color:var(--ink3)}
.sheet .seg button.on{background:var(--alyi);color:#fff}
.sheet .label{color:var(--ink3)}

/* Онбординг: арка с козой и веер карт вместо схем */
.arch{position:relative;width:min(220px,56vw);aspect-ratio:.66;border-radius:999px 999px 22px 22px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.7),0 30px 60px rgba(16,40,64,.35)}
.arch i{position:absolute;inset:-8%;background:url(assets/goat-sun.webp) 38% 50%/300% auto;animation:archzoom 14s ease-in-out infinite alternate}
.arch::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 6px rgba(248,241,231,.9)}
@keyframes archzoom{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,-2%)}}
.slide.seen .arch{animation:archin 1.2s var(--spring) .1s both}
@keyframes archin{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.sun{position:absolute;width:70px;height:70px;border-radius:50%;left:50%;top:6%;margin-left:56px;background:radial-gradient(circle,#FFF8EC 0%,rgba(255,226,196,.7) 35%,rgba(255,226,196,0) 70%);animation:pulse 4s ease-in-out infinite}
.ofan{position:relative;width:100%;height:190px}
.ofan .sc{top:40px;width:62px;height:94px;margin-left:-31px;transform-origin:50% 300%;animation:none;opacity:0}
.slide.seen .ofan .sc{animation:fanout 1.1s var(--spring) both;animation-delay:calc(.15s + var(--k) * 60ms)}
.ofan .sc .fi{animation:none}
.ofan .sc .ff .fm{font-size:14px}
.ofan .sc.hi .ff{box-shadow:0 0 0 2px var(--alyi-l),0 10px 24px rgba(211,58,40,.4)}

/* v26: подписи на картах читаются поверх моря, веер в онбординге не наезжает на заголовок */
.ff{background:linear-gradient(180deg,rgba(248,241,231,.82) 0%,rgba(248,241,231,.5) 45%,rgba(248,241,231,.05) 78%),url(assets/goat-sun.webp) var(--bp,10% 40%)/360% auto}
.fm{color:var(--ink2);text-shadow:0 1px 8px rgba(248,241,231,.9)}
.fd{color:var(--ink2);text-shadow:0 1px 6px rgba(248,241,231,.9)}
.ofan{height:150px;margin-top:30px}
.ofan .sc{top:44px;width:46px;height:70px;margin-left:-23px;transform-origin:50% 380%}
.ofan .sc .ff .fm{font-size:12px}

.slide[data-k="2"] .ill{flex:0 0 auto;min-height:0;height:170px}
.ofan{height:170px;margin-top:0}
.ofan .sc{--a:calc((var(--k) - 5.5) * 6deg) !important;top:56px}
/* v27: арка видна сразу вместе с экраном; фото автора */
.slide .arch,.slide.seen .arch{animation:none;opacity:1;transform:none}
.author .av.ph{width:56px;height:56px;background:url(assets/veronika.webp) center/cover;box-shadow:0 0 0 2px var(--alyi-l),0 6px 16px rgba(16,40,64,.3)}
.screen.lang.fade{transition:opacity .35s ease}
@media (max-height:700px){ .slide[data-k="2"] .ill{height:130px} .ofan{height:130px} .ofan .sc{top:30px;width:40px;height:60px;margin-left:-20px} }
/* v28: карусель месяцев как на референсе: большая карта в центре, соседние меньше по бокам */
.night .mtop{justify-content:space-between;gap:8px;height:auto;min-height:52px;padding-top:4px}
.mtop .tsp{width:38px;flex-shrink:0}
.mttl{flex:1;text-align:center;font:400 calc(26px - 6px * var(--c,0))/1.08 var(--f-serif);color:#fff;text-wrap:balance}

/* Кольцо месяцев (SVG 1000×1000, центр в солнце).
   Каждая карта: внешний слой — форма-трапеция, повёрнутая на свой угол (clipPath);
   внутренний — пейзаж, который стоит ровно (поворот формы компенсирован) и покрывает её с запасом (slice);
   подпись — отдельный HTML-слой, всегда горизонтальный. */
const RG = {ro: 488, ri: 205, gap: 16, rad: 16, lab: 420};
function ringSVG(){
  const C = 500, {ro, ri, gap, rad} = RG, half = Math.PI / 12;
  const wo = 2 * ro * Math.sin(half) - gap, wi = 2 * ri * Math.sin(half) - gap;
  const yo = C - ro * Math.cos(Math.asin(wo / 2 / ro)), yi = C - ri;   /* внешний край касается окружности */
  const P = [[C - wo / 2, yo], [C + wo / 2, yo], [C + wi / 2, yi], [C - wi / 2, yi]];
  const rot = (x, y, t) => [C + (x - C) * Math.cos(t) - (y - C) * Math.sin(t), C + (x - C) * Math.sin(t) + (y - C) * Math.cos(t)];
  const path = pts => { /* скруглённые углы */
    let d = ''; pts.forEach((p, i) => { const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
      const u = (q) => { const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy); return [p[0] + dx / L * rad, p[1] + dy / L * rad]; };
      const s0 = u(a), s1 = u(b); d += (i ? 'L' : 'M') + s0.map(v => v.toFixed(1)).join(' ') + 'Q' + p.map(v => v.toFixed(1)).join(' ') + ' ' + s1.map(v => v.toFixed(1)).join(' '); });
    return d + 'Z'; };
  let defs = '', body = '';
  for (let k = 0; k < 12; k++){
    const t = k * Math.PI / 6, pts = P.map(([x, y]) => rot(x, y, t)), d = path(pts);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs) - 2, y0 = Math.min(...ys) - 2, w = Math.max(...xs) - x0 + 2, h = Math.max(...ys) - y0 + 2;
    const mx = (Math.sin(t) * -50).toFixed(1), my = (Math.cos(t) * 50).toFixed(1);
    defs += `<clipPath id="mclip${k}"><path d="${d}"/></clipPath>`;
    body += `<g class="rcard" style="--k:${k};--mx:${mx}px;--my:${my}px"><image href="assets/land/${pad(k + 1)}.webp" x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#mclip${k})"/><path class="redge" d="${d}"/></g>`;
  }
  return `<svg class="rsvg" viewBox="0 0 1000 1000" aria-hidden="true"><defs>${defs}</defs>${body}</svg>`;
}

const FOGS = [['.fA', 11, .56, 21, -1], ['.fB', 29, .4, 29, 1], ['.fC', 47, .6, 16, -1]];

    tile.style.backgroundImage = `url(${FOG_TEX[k]})`; box.style.opacity = op;

/* Слайд «Твой год как один маршрут»: волна года, подъёмы и спады. Это условный пример, а не чей-то прогноз */
function yearWave(){
  /* волна растянута на ширину текста: от буквы «Т» в заголовке до правого края. Рисуется в долях, поэтому подходит к любой ширине */
  const Y = [108, 84, 62, 86, 122, 134, 108, 70, 40, 60, 110, 90].map(y => (y - 30) / 110 * 80); /* снизу остаётся место под подпись «переждать» */

  for (let i = 0; i < P.length - 1; i++){ const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2; /* плавная кривая через все точки */
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  const ms = MS();
  const tags = [[2, 'действовать', ''], [5, 'переждать', 'calm'], [8, 'побеждать', 'best']];
  const at = (x, y) => `left:${(x / 10).toFixed(2)}%;top:${y.toFixed(2)}%`;
  return `<div class="wave"><div class="wplot"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="wvf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4E6" stop-opacity=".34"/><stop offset="1" stop-color="#FFF4E6" stop-opacity="0"/></linearGradient>
    <clipPath id="wclip"><rect class="wclip" x="-20" y="-20" width="0" height="140"/></clipPath></defs>
    <line class="wbase" x1="0" y1="54" x2="1000" y2="54"/>
    <path class="warea" d="${d} L1000 125 L0 125 Z" fill="url(#wvf)"/>
    <path class="wline" d="${d}" clip-path="url(#wclip)"/>
  </svg>${P.map(([x, y], k) => `<i class="wdot${k === 0 ? ' first' : ''}" style="${at(x, y)};--k:${k}"></i>`).join('')}

}
/* линия рисуется слева направо, огонёк едет по ней */
function waveRun(slide){

  const line = w.querySelector('.wline'), rect = w.querySelector('.wclip'), mk = w.querySelector('.wmark');
  const L = line.getTotalLength(), pts = []; for (let i = 0; i <= 240; i++){ const q = line.getPointAtLength(L * i / 240); pts.push([q.x, q.y]); }
  const yAt = x => { let j = 1; while (j < pts.length - 1 && pts[j][0] < x) j++; const a = pts[j - 1], b = pts[j], t = b[0] === a[0] ? 0 : (x - a[0]) / (b[0] - a[0]); return a[1] + (b[1] - a[1]) * Math.max(0, Math.min(1, t)); };
  const set = x => { rect.setAttribute('width', x + 20); mk.style.left = (x / 10) + '%'; mk.style.top = yAt(x) + '%'; };
  if (RM){ set(1000); return; }
  set(0); const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, t0 = performance.now() + 300;
  const fr = now => { const t = Math.max(0, Math.min(1, (now - t0) / 2400)); set(1000 * ease(t)); if (t < 1 && w.isConnected) requestAnimationFrame(fr); };
  requestAnimationFrame(fr);

/* Барабаны даты как рулетка: 3D-цилиндр, бросок пальцем, всегда встаёт ровно на значение */
function wheelsInit(el){
  const IH = 44, STEP = 20, R = IH / 2 / Math.tan(STEP / 2 * Math.PI / 180);
  const W = {};
  el.querySelectorAll('.wh').forEach((w, col) => {
    const k = w.dataset.k, list = w.querySelector('.wl'), items = [...w.querySelectorAll('.wi')], n = items.length;
    list.style.transform = `translateZ(${-R.toFixed(1)}px)`;
    let pos = Math.max(0, items.findIndex(x => x.dataset.v === String(S.draft[k]))), raf = 0, lastTick = Math.round(pos), lastHap = 0;
    const paint = () => {
      const c = pos < 0 ? pos * .35 : pos > n - 1 ? n - 1 + (pos - n + 1) * .35 : pos; /* упругий край */
      const r = Math.round(c);
      items.forEach((it, j) => { const d = j - c;
        if (Math.abs(d) > 4.4){ if (it.style.visibility !== 'hidden') it.style.visibility = 'hidden'; return; }
        it.style.visibility = 'visible';
        it.style.transform = `rotateX(${(-d * STEP).toFixed(2)}deg) translateZ(${R.toFixed(1)}px)`;
        it.style.opacity = Math.max(.12, Math.cos(d * STEP * Math.PI / 180) ** 1.6).toFixed(2);
        it.classList.toggle('on', j === r); });
      if (r !== lastTick && r >= 0 && r < n){ lastTick = r; const t = performance.now(); if (t - lastHap > 60){ lastHap = t; hap('select'); } }
    };
    const commit = () => { const j = Math.max(0, Math.min(n - 1, Math.round(pos))), v = +items[j].dataset.v;
      if (S.draft[k] !== v) S.draft[k] = v;
      const mx = dim(S.draft.y, S.draft.m);
      if (W.d) W.d.mark(mx);
      if (S.draft.d > mx){ S.draft.d = mx; W.d && W.d.to(mx - 1); }
      const h = el.querySelector('#dh span'); if (h) h.innerHTML = dobHint(); };
    /* плавный доезд до значения: замедление в конце, как у колеса */
    const to = (target, dur) => { cancelAnimationFrame(raf); target = Math.max(0, Math.min(n - 1, target));
      const from = pos, dist = Math.abs(target - from); if (RM || dist < .001){ pos = target; paint(); commit(); return; }
      dur = dur || Math.min(1250, 220 + Math.sqrt(dist) * 150); const t0 = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3.2);
      const fr = now => { const t = Math.min(1, (now - t0) / dur); pos = from + (target - from) * ease(t); paint(); if (t < 1) raf = requestAnimationFrame(fr); else { pos = target; paint(); commit(); } };
      raf = requestAnimationFrame(fr); };
    W[k] = { to, mark: mx => items.forEach((it, j) => it.classList.toggle('na', k === 'd' && j + 1 > mx)) };
    let y0 = null, p0 = 0, moved = 0, samples = [];
    w.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); y0 = e.clientY; p0 = pos; moved = 0; samples = [[e.clientY, performance.now()]]; w.classList.add('grab'); try { w.setPointerCapture(e.pointerId); } catch (_) {} });
    w.addEventListener('pointermove', e => { if (y0 == null) return; const dy = e.clientY - y0; moved = Math.max(moved, Math.abs(dy));
      pos = p0 - dy / IH; paint(); samples.push([e.clientY, performance.now()]); if (samples.length > 6) samples.shift(); });
    const up = e => { if (y0 == null) return; y0 = null; w.classList.remove('grab');
      if (moved < 6){ /* нажатие: строка выше или ниже центра едет в центр */
        const r = w.getBoundingClientRect(), off = (e.clientY - (r.top + r.height / 2)) / IH;
        return to(Math.round(pos) + Math.max(-3, Math.min(3, Math.round(off * 1.15)))); }
      const now = performance.now(), last = samples[samples.length - 1], old = samples.find(s => now - s[1] < 100) || samples[0];
      const v = last[1] > old[1] && now - last[1] < 80 ? (last[0] - old[0]) / (last[1] - old[1]) : 0; /* px/ms */
      const proj = -v * (240 + 300 * Math.abs(v)) / IH; /* куда бы докатилось колесо: чем резче бросок, тем дальше */
      to(Math.round(pos + Math.max(-45, Math.min(45, proj)))); };
    w.addEventListener('pointerup', up); w.addEventListener('pointercancel', up);
    let wacc = 0, wt; w.addEventListener('wheel', e => { e.preventDefault(); wacc += e.deltaY; clearTimeout(wt);
      if (Math.abs(wacc) >= 30){ const st = Math.sign(wacc); wacc = 0; to(Math.round(pos) + st, 260); }
      wt = setTimeout(() => wacc = 0, 160); }, {passive: false});
    w.tabIndex = 0; w.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); to(Math.round(pos) + (e.key === 'ArrowDown' ? 1 : -1), 240); } });
    /* вход экрана: барабаны раскручиваются и встают на сохранённую дату */
    const final = pos; if (!RM){ pos = Math.max(0, Math.min(n - 1, final + (col % 2 ? -5 : 5))); lastTick = Math.round(pos); paint(); setTimeout(() => to(final, 600 + col * 100), 120 + col * 60); } else paint();
  });
  if (W.d) W.d.mark(dim(S.draft.y, S.draft.m));
}

/* Веер карт месяцев: тянешь пальцем, карты поворачиваются по дуге, ближайшая встаёт в центр */
function fanLayout(car, pos){
  const W = car.clientWidth || 360, cw = Math.min(170, W * .44);
  car.querySelectorAll('.cc').forEach(c => {
    const k = +c.dataset.k, off = k - pos, a = Math.abs(off), sg = Math.sign(off);
    const x = sg * (a <= 1 ? a * cw * .78 : cw * .78 + (a - 1) * cw * .34);
    c.style.transform = `translateX(${x.toFixed(1)}px) scale(${(1 - Math.min(a, 2.2) * .17).toFixed(3)})`;
    c.style.opacity = a > 2.4 ? 0 : (1 - Math.max(0, a - 1.4)).toFixed(2);
    c.style.zIndex = 100 - Math.round(a * 10);
    c.classList.toggle('cur', Math.round(pos) === k);
  });
  const d = car.closest('.night') && car.closest('.night').querySelectorAll('.cdots i');
  if (d) d.forEach((x, k) => x.classList.toggle('on', k === Math.max(0, Math.min(11, Math.round(pos)))));
}
function fanInit(el, car){
  const wrap = el.querySelector('.carw');
  let pos = S.month;
  fanLayout(car, pos);
  requestAnimationFrame(() => car.classList.add('ready'));
  let x0 = null, p0 = 0, moved = 0, lastX = 0, lastT = 0, vel = 0, tgt = null;
  const step = () => Math.min(170, (car.clientWidth || 360) * .44) * .78;
  wrap.addEventListener('pointerdown', e => { x0 = e.clientX; p0 = pos; moved = 0; vel = 0; lastX = e.clientX; lastT = performance.now(); tgt = e.target.closest('.cc'); car.classList.remove('snap'); try { wrap.setPointerCapture(e.pointerId); } catch (_) {} });
  wrap.addEventListener('pointermove', e => {
    if (x0 == null) return; const dx = e.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    const np = Math.max(-.4, Math.min(11.4, p0 - dx / (step() * .62)));
    if (Math.round(np) !== Math.round(pos)) hap('select');
    pos = np; fanLayout(car, pos);
  });
  const up = () => {
    if (x0 == null) return; x0 = null;
    if (performance.now() - lastT > 90) vel = 0;
    let k = moved < 6 && tgt ? +tgt.dataset.k : Math.round(pos + Math.max(-5, Math.min(5, -vel * 200 / (step() * .62))));
    k = Math.max(0, Math.min(11, k));
    car.classList.add('snap'); pos = k; fanLayout(car, k);
    if (k !== S.month) setMonth(k, true);
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  el._carTo = k => { pos = k; car.classList.add('snap'); fanLayout(car, k); };
}

  [node, ...node.querySelectorAll('[aria-label],[placeholder],[alt]')].forEach(e => ['aria-label', 'placeholder', 'alt'].forEach(a => {
    const v = e.getAttribute && e.getAttribute(a); if (v && HAS_RU.test(v)){ const u = trUK(v.trim()); if (u !== v.trim()) e.setAttribute(a, u); } }));
}
new MutationObserver(ms => { if (S.lang !== 'uk') return; ms.forEach(m => m.type === 'characterData' ? l10n(m.target) : m.addedNodes.forEach(l10n)); })
  .observe(document.getElementById('app'), {childList: true, subtree: true, characterData: true});
const MS = () => MSHORT[S.lang === 'uk' ? 'uk' : 'ru'];
function applyLang(){
  const uk = S.lang === 'uk';
  MONTHS = uk ? MONTHS_UK : MONTHS_RU; MGEN = uk ? MGEN_UK : MGEN_RU; MPREP = uk ? MPREP_UK : MPREP_RU;
  MONTH_TEXT = uk ? MONTH_TEXT_UK : MONTH_TEXT_RU; YEAR_TEXT = uk ? YEAR_TEXT_UK : YEAR_TEXT_RU;
  document.documentElement.lang = uk ? 'uk' : 'ru';
}

/* Быстрый вход для просмотра:
   ?demo=intro | back | lang | onb | name | gender | dob | confirm | tariffs | main | year | profile | success | fail
   &access=none|months|all, &people, &slide=0..2, &hold (заставка без перехода), &still (без анимаций) */
const Q = new URLSearchParams(location.search); if (Q.get('lang') === 'uk'){ S.lang = 'uk'; applyLang(); } /* для скриншотов: &lang=uk */
if (Q.has('demo')){
  S.profiles = [{name:'Мария', gender: Q.get('g') || 'f', d:25, m:7, y:1992, access: Q.get('access') || 'none', self:true}];
  if (Q.has('people')) S.profiles.push({name:'Андрей', gender:'m', d:3, m:2, y:1990, access:'none', self:false}, {name:'Елена', gender:'f', d:17, m:10, y:1965, access:'all', self:false});
  const v = Q.get('demo');
  S.month = +(Q.get('month') || 0);
  const D = () => { S.mode = 'self'; S.draft = {name:'Мария', gender: Q.get('g') || 'f', d:25, m:7, y:1992}; S.hist = ['onb']; };
  if (v === 'intro') go('intro', false);
  else if (v === 'back'){ S.profiles[0].access = Q.get('access') || 'months'; bootIntro(); } /* вход уже оплатившего: ?demo=back&access=months|all */
  else if (v === 'lang') go('lang', false);
  else if (v === 'onb'){ S.onbI = +(Q.get('slide') || 0); go('onb', false); }
  else if (v === 'name'){ D(); go('name'); }
  else if (v === 'gender'){ D(); S.draft.gender = Q.get('g') || ''; go('gender'); }
  else if (v === 'dob'){ D(); go('dob'); }
  else if (v === 'confirm'){ D(); go('confirm'); }
  else if (v === 'tariffs'){ S.hist = ['main']; go('tariffs'); }
  else if (v === 'year'){ S.tab = 'y'; S.ytopic = Q.get('topic') || null; go('main', false); }
  else if (v === 'profile'){ S.hist = ['main']; go('profile'); }
  else if (v === 'success'){ S.forIdx = 0; S.lastPlan = Q.get('plan') || 'months'; go('success', false); }
  else if (v === 'fail'){ go('fail', false); }
  else go('main', false);
  if (Q.has('expand')) setTimeout(() => { const b = cur().querySelector('.more'); if (b) toggleSec(b); }, 80);
  if (Q.has('scroll')) setTimeout(() => { const sc = cur().querySelector('.scroll'); if (sc) { sc.scrollTop = +Q.get('scroll'); sc.dispatchEvent(new Event('scroll')); } }, 150);
} else bootIntro();
/* Первый кадр — сразу коза с дымкой: ждём, пока фото и туман готовы, и только тогда показываем заставку */
function bootIntro(){
  app.style.background = '#718094';
  const im = new Image(); im.src = 'assets/goat-sun.webp';
  const ready = Promise.race([(im.decode ? im.decode() : new Promise(r => im.onload = r)).catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
  ready.then(() => { if (!FOG_TEX) FOG_TEX = FOGS.map(f => fogTexture(f[1])); go('intro', false); setTimeout(() => app.style.background = '', 900); });
}
</script>
