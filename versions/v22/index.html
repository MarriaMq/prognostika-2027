<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Прогностика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/bg.jpg">
<link rel="preload" as="image" href="assets/cliff.webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Прогностика 2027, вторая ветка прототипа (v2).
   Пролёт в пещеру, онбординг с параллаксом, веер карт месяцев, анимированная оплата. */
:root{
  --ink:#071B48;
  --ink-2:rgba(7,27,72,.64);
  --ink-3:rgba(7,27,72,.40);
  --accent:#B3122F;
  --bg:#FFFFFF;
  --line:#A5B2C5;
  --line-soft:rgba(165,178,197,.42);
  --mist:#F7F8FB;
  --night:#070B1C;
  --burg:radial-gradient(ellipse at 80% 100%,#E5415D 0%,#B3122F 50%,#7E0B22 100%);
  --f-display:'Montserrat',system-ui,sans-serif;
  --f-text:'Inter',system-ui,sans-serif;
  --g:24px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.2,1.12,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

#app{position:relative;width:100%;height:var(--tg-viewport-stable-height,100dvh);overflow:hidden;background:var(--night)}
@supports not (height:100dvh){ #app{height:var(--tg-viewport-stable-height,100vh)} }
@media (min-width:600px){
  body{display:grid;place-items:center;background:#E7EBF1}
  #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(7,27,72,.18)}
  body.tg{display:block;background:var(--bg)}
  body.tg #app{width:100%;max-width:560px;margin:0 auto;height:var(--tg-viewport-stable-height,100vh);border-radius:0;box-shadow:none}
}

.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;transform:translateX(42px);transition:opacity .35s ease,transform .6s var(--spring);overflow:hidden}
.screen.in{opacity:1;transform:none}
.screen.back{transform:translateX(-42px)}
.screen.back.in{transform:none}
.screen.fade{transform:scale(1.04);transition:opacity .9s ease,transform 1.2s var(--ease)}
.screen.fade.in{transform:none}
.screen.dark{background:var(--night);color:#fff}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i, 0) * 55ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes tabin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(7,27,72,.16) transparent}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(7,27,72,.16);border-radius:3px}

/* Пылинки в пещере и звёзды в шапке */
.dust{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,222,200,.85);box-shadow:0 0 8px rgba(255,170,150,.7);opacity:0;animation:float var(--d) linear var(--dl) infinite}
@keyframes float{0%{transform:translate(0,0);opacity:0}18%{opacity:.85}100%{transform:translate(var(--x),-140px);opacity:0}}
.stars i{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);animation:twinkle var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

/* ---------- 1. Пролёт в пещеру ---------- */
.intro{background:#0B1F45;color:#fff;transition:none;cursor:pointer}
.stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
.ly{position:absolute;background-size:100% 100%;will-change:transform;transform:scale(1)}
.ly.bg{background-image:url(assets/bg.jpg)}
.ly.cl{background-image:url(assets/cliff.webp)}
.ly.gt{background-image:url(assets/goat.webp)}
.intro.push .ly.bg{transform:scale(1.04);transition:transform 1.6s ease-out}
.intro.push .ly.cl{transform:scale(1.09);transition:transform 1.6s ease-out}
.intro.push .ly.gt{transform:scale(1.11);transition:transform 1.6s ease-out}
.intro.fly .ly{transition:transform 1.7s cubic-bezier(.6,0,.22,1)}
.intro.fly .ly.bg{transform:scale(2.4)}
.intro.fly .ly.cl{transform:scale(20)}
.intro.fly .ly.gt{transform:scale(30)}
.veil{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at var(--vx,80%) var(--vy,55%),rgba(7,11,28,.2) 0%,rgba(7,11,28,.96) 38%,#070B1C 60%);opacity:0;pointer-events:none;transition:opacity .8s ease}
.intro.deep .veil{opacity:1}
.intro::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(7,27,72,.62) 0%,rgba(7,27,72,0) 100%);z-index:1;pointer-events:none;transition:opacity .6s}
.intro.fly::before{opacity:0}
.intro .ttl{position:relative;z-index:2;padding:calc(var(--safe-t) + 72px) var(--g) 0;opacity:0;transform:translateY(12px);transition:opacity .9s ease .15s,transform .9s var(--ease) .15s}
.intro.push .ttl{opacity:1;transform:none}
.intro.fly .ttl{opacity:0;transform:translateY(-30px) scale(.96);transition:opacity .5s ease,transform .8s var(--ease)}
.intro .ttl h1{font:600 clamp(36px,12.2vw,46px)/1.04 var(--f-display);letter-spacing:-.025em}
.intro .ttl p{font:500 15px/1.4 var(--f-display);color:rgba(255,255,255,.82);margin-top:14px}
.intro .tap{position:absolute;z-index:2;left:0;right:0;bottom:calc(30px + var(--safe-b));text-align:center;font:500 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);opacity:0;transition:opacity .6s ease .9s}
.intro.push .tap{opacity:1}
.intro.fly .tap{opacity:0;transition-delay:0s}

/* ---------- Тёмные экраны пещеры ---------- */
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(10px)}
.glow.a{width:120%;height:60%;left:-10%;top:-12%;background:radial-gradient(closest-side,rgba(179,18,47,.42),rgba(179,18,47,0))}
.glow.b{width:90%;height:50%;right:-30%;bottom:-6%;background:radial-gradient(closest-side,rgba(229,65,93,.22),rgba(229,65,93,0))}
.dk-btn{width:100%;min-height:84px;border-radius:22px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:0 22px;display:flex;align-items:center;gap:18px;text-align:left;color:#fff;transition:background .2s,transform .15s}
.dk-btn:active{background:rgba(255,255,255,.12);transform:scale(.99)}
.dk-btn .code{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;font:600 15px/1 var(--f-display);letter-spacing:.06em;flex-shrink:0}
.dk-btn .n{display:block;font:600 19px/1.2 var(--f-display)}
.dk-btn .d{display:block;font:400 14px/1.4 var(--f-text);color:rgba(255,255,255,.62);margin-top:3px}
.lwrap{position:relative;z-index:1;padding:calc(var(--safe-t) + 56px) var(--g) calc(24px + var(--safe-b));display:flex;flex-direction:column;height:100%}
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.lwrap .eyebrow{color:#F0A3B0}
.lq{font:600 34px/1.15 var(--f-display);letter-spacing:-.02em;margin-top:20px}
.lq span{display:block;color:rgba(255,255,255,.45)}
.lchoices{display:flex;flex-direction:column;gap:12px;margin-top:auto}

/* ---------- 2. Онбординг: три слайда с параллаксом ---------- */
.onb .top{position:relative;z-index:3;height:64px;margin-top:var(--safe-t);padding:0 12px 0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.onb .brand{white-space:nowrap;font:600 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.skip{height:44px;padding:0 12px;font:500 15px/1 var(--f-display);color:rgba(255,255,255,.75);transition:opacity .3s}
.onb.last .skip{opacity:0;pointer-events:none}
.ovp{position:relative;flex:1;overflow:hidden;touch-action:pan-y}
.pager{display:flex;height:100%;will-change:transform}
.slide{flex:0 0 100%;height:100%;position:relative;display:flex;flex-direction:column;padding:0 var(--g);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.ill{position:relative;flex:1;min-height:180px;display:grid;place-items:center;transform:translateX(calc(var(--p,0) * -55%))}
.otx{transform:translateX(calc(var(--p,0) * 22%));opacity:var(--o,1);padding-bottom:8px}
.pager.anim,.pager.anim .ill,.pager.anim .otx{transition:transform .65s var(--spring),opacity .4s ease}
.otx h2{font:600 clamp(24px,7.4vw,29px)/1.18 var(--f-display);letter-spacing:-.015em}
.otx p{font:400 16px/1.55 var(--f-text);color:rgba(255,255,255,.72);margin-top:12px}
.otx .fine{font-size:14px;color:rgba(255,255,255,.55);margin-top:12px}
.ogl{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;transition:transform .65s var(--spring)}
.onb .bottom{position:relative;z-index:3}
.dots{display:flex;gap:8px;justify-content:center;height:20px;align-items:center}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.25);transition:width .4s var(--spring),background .3s}
.dots i.on{width:26px;background:#fff}
.onb .b-last{display:none}
.onb.last .b-next{display:none}
.onb.last .b-last{display:flex}

/* Слайд 1: дата превращается в 12 месяцев */
.orb{position:relative;width:min(250px,64vw);aspect-ratio:1}
.orb .ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.orb .ring.r2{inset:16%;border-color:rgba(240,163,176,.2)}
.orb .date{position:absolute;inset:0;display:grid;place-items:center;font:600 clamp(30px,9vw,38px)/1 var(--f-display);letter-spacing:.02em}
.orb .date span{display:inline-block}
.slide.seen .orb .date span{animation:digit 1.4s var(--ease) both;animation-delay:calc(var(--k) * 70ms + .5s)}
@keyframes digit{0%{opacity:1;transform:none}60%{opacity:.0;transform:translate(var(--tx),var(--ty)) scale(.4)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.2)}}
.orb .core{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,#F45670 0%,#B3122F 55%,rgba(179,18,47,0) 72%);opacity:0;transform:scale(.4)}
.slide.seen .orb .core{animation:core 1.2s var(--spring) 1.5s both,pulse 3.4s ease-in-out 2.7s infinite}
@keyframes core{to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.orb .orbit{position:absolute;inset:0;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .m{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:grid;place-items:center;font:600 10px/1 var(--f-display);letter-spacing:.04em;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);transform:rotate(var(--a)) translateY(calc(min(250px,64vw) * -.44)) rotate(calc(var(--a) * -1));opacity:0}
.slide.seen .orb .m{animation:mon .7s var(--spring) both;animation-delay:calc(var(--k) * 90ms + 1.3s)}
@keyframes mon{from{opacity:0;transform:rotate(var(--a)) translateY(0) rotate(calc(var(--a) * -1)) scale(.3)}to{opacity:1}}

/* Слайд 2: пример прогноза */
.peek{width:min(300px,78vw);background:linear-gradient(165deg,#FFFDF9,#F3EBE2);color:var(--ink);border-radius:24px;padding:20px 20px 22px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);transform:rotate(-3deg)}
.slide.seen .peek{animation:peek 1s var(--spring) .2s both}
@keyframes peek{from{opacity:0;transform:translateY(40px) rotate(4deg)}to{opacity:1;transform:rotate(-3deg)}}
.peek .pm{font:600 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.peek h4{font:600 18px/1.2 var(--f-display);margin-top:10px}
.peek p{font:400 14px/1.55 var(--f-text);margin-top:8px}
.peek .bl{filter:blur(4px);opacity:.7;user-select:none}
.peek .lockchip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;height:30px;padding:0 12px;border-radius:15px;background:var(--ink);color:#fff;font:600 12px/1 var(--f-display)}
.peek .lockchip svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{height:32px;padding:0 13px;border-radius:16px;border:1px solid rgba(255,255,255,.2);display:inline-flex;align-items:center;font:500 13px/1 var(--f-display);color:rgba(255,255,255,.85)}

/* Слайд 3: маршрут, автор, отзывы */
.route{width:min(300px,80vw);height:auto;overflow:visible}
.route path{fill:none;stroke:rgba(240,163,176,.75);stroke-width:1.5;stroke-dasharray:900;stroke-dashoffset:900}
.slide.seen .route path{animation:dash 2.6s var(--ease) .3s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.route circle{fill:#fff;opacity:0}
.slide.seen .route circle{animation:star .5s ease forwards;animation-delay:calc(var(--k) * 180ms + .3s)}
@keyframes star{to{opacity:1}}
.route text{fill:rgba(255,255,255,.6);font:600 9px var(--f-display);letter-spacing:.06em;opacity:0}
.slide.seen .route text{animation:star .5s ease forwards;animation-delay:calc(var(--k) * 180ms + .45s)}
.author{display:flex;align-items:center;gap:12px;margin-top:16px}
.author .av{width:44px;height:44px;border-radius:50%;background:var(--burg);display:grid;place-items:center;font:600 17px/1 var(--f-display);flex-shrink:0}
.author .t{display:block;font:600 14px/1.3 var(--f-display)}
.author .d{display:block;font:400 13px/1.4 var(--f-text);color:rgba(255,255,255,.6);margin-top:2px}
.stat{margin-top:12px;font:500 14px/1.4 var(--f-text);color:#F0A3B0}
.revs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px calc(var(--g) * -1) 0;padding:0 var(--g) 4px;scrollbar-width:none}
.revs::-webkit-scrollbar{display:none}
.rev{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:12px 14px;font:400 14px/1.45 var(--f-text);color:rgba(255,255,255,.88)}
.rev b{display:block;font:600 12px/1 var(--f-display);color:rgba(255,255,255,.55);margin-top:8px}

/* ---------- Кнопки ---------- */
.bottom{padding:16px var(--g) calc(16px + var(--safe-b));flex-shrink:0;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.dark .bottom,.bottom.clear{background:none}
.btn{height:56px;border-radius:28px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px/1 var(--f-display);letter-spacing:.01em;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--burg);color:#fff;box-shadow:0 10px 26px rgba(179,18,47,.28)}
.btn.primary:disabled{background:var(--mist);color:var(--line);box-shadow:none;transform:none;cursor:default}
.btn.white{background:#fff;color:var(--ink)}
.btn.secondary{border:1px solid var(--line)}
.btn.ghost-d{border:1px solid rgba(255,255,255,.28);color:#fff}
.btn.text{height:46px;color:var(--ink-2);font-weight:500}
.dark .btn.text{color:rgba(255,255,255,.75)}
.btn.split{justify-content:space-between;padding:0 26px;gap:12px}
.btn.split > span{white-space:nowrap}
.btn svg{width:20px;height:20px}

/* ---------- 3. Регистрация ---------- */
.bar{height:64px;margin-top:var(--safe-t);padding:0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:background .2s}
.ib:active{background:var(--mist)}
.ib svg{width:20px;height:20px}
.ib.ghost{border-color:transparent}
.spacer{width:44px}
.steps{display:flex;gap:6px}
.steps i{width:28px;height:3px;border-radius:2px;background:var(--line-soft);transition:background .3s}
.steps i.on{background:var(--accent)}
.form{padding:16px var(--g) 0}
.h1{font:600 28px/1.2 var(--f-display);letter-spacing:-.015em}
.lead{font:400 16px/1.5 var(--f-text);color:var(--ink-2);margin-top:12px}
.field{margin-top:40px}
.uline{width:100%;height:60px;border:0;border-bottom:1.5px solid var(--line);padding:0;font:500 26px/1 var(--f-display);outline:none;background:transparent;border-radius:0;transition:border-color .2s}
.uline:focus{border-color:var(--ink)}
.uline::placeholder{color:var(--ink-3);font-weight:400}
.gbig{display:flex;flex-direction:column;gap:12px}
.gbig button{height:76px;border-radius:22px;background:var(--mist);padding:0 22px;display:flex;align-items:center;justify-content:space-between;font:600 19px/1 var(--f-display);transition:background .2s,color .2s,transform .15s}
.gbig button:active{transform:scale(.99)}
.gbig button svg{width:22px;height:22px;opacity:.5}
.gbig button.on{background:var(--ink);color:#fff}
/* Барабаны для даты */
.wheels{position:relative;display:grid;grid-template-columns:.7fr 1.45fr 1fr;gap:6px;height:220px;margin-top:30px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-radius:14px;background:var(--mist);pointer-events:none}
.wh{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;perspective:600px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 32%,#000 68%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 32%,#000 68%,transparent 100%);overscroll-behavior:contain}
.wh::-webkit-scrollbar{display:none}
.wpad{height:88px}
.wi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font:500 19px/1 var(--f-display);color:var(--ink-3);cursor:pointer;transform-origin:50% 50% -60px;transition:color .15s}
.wi.on{color:var(--ink);font-weight:600}
.wlab{display:grid;grid-template-columns:.7fr 1.45fr 1fr;gap:6px;margin-top:24px;text-align:center;font:500 13px/1 var(--f-display);color:var(--ink-2)}
.hintc{display:flex;gap:12px;margin-top:22px;padding:14px 16px;border-radius:18px;background:var(--mist);font:400 14px/1.5 var(--f-text);color:var(--ink-2)}
.hintc svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--accent)}
.hintc b{color:var(--ink);font-weight:600}
/* Проверка */
.ccard{margin-top:26px;border-radius:24px;background:var(--mist);padding:22px 20px}
.ccard .row{display:flex;justify-content:space-between;gap:12px;font:400 15px/1.4 var(--f-text);color:var(--ink-2)}
.ccard .row + .row{margin-top:10px}
.ccard .row b{color:var(--ink);font-weight:600}
.ccard .big{font:600 clamp(28px,8.6vw,34px)/1.1 var(--f-display);letter-spacing:-.02em;margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft)}
.ccard .bigl{font:500 13px/1 var(--f-display);color:var(--ink-2);margin-top:18px}
.ccard .bigl + .big{margin-top:8px;padding-top:0;border-top:0}
.note{margin-top:16px;font:400 14px/1.5 var(--f-text);color:var(--ink-2)}

/* ---------- 4. Тарифы ---------- */
.urg{display:flex;align-items:center;gap:10px;margin-top:12px;font:500 15px/1.45 var(--f-text);color:var(--accent)}
.urg svg{width:18px;height:18px;flex-shrink:0}
.plans{display:flex;flex-direction:column;gap:12px;padding:24px var(--g) 0}
.plan{position:relative;width:100%;min-height:92px;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;transition:transform .15s ease;overflow:hidden}
.plan:active{transform:scale(.985)}

  return [s, e];
}

/* Чтение прогноза: прогресс в шапке, сжатие шапки, плавное появление блоков */
function initRead(el){
  const sc = el.querySelector('.scroll'), head = el.querySelector('.night');
  if (!sc || !head || !el.querySelector('.content')) return;
  fitFolds(el);
  if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => fitFolds(el));
  if (!head.querySelector('.rprog')) head.insertAdjacentHTML('beforeend', '<div class="rprog"><i></i></div>');
  const bar = head.querySelector('.rprog i');
  const upd = () => { const max = sc.scrollHeight - sc.clientHeight; bar.style.transform = `scaleX(${max > 0 ? Math.min(1, sc.scrollTop / max) : 0})`; if (!RM) head.style.setProperty('--c', Math.min(1, sc.scrollTop / 160).toFixed(3)); };
  if (!sc.dataset.rp){ sc.dataset.rp = 1; sc.addEventListener('scroll', upd, {passive: true}); }
  upd();
  if (RM || !('IntersectionObserver' in window)) return;
  const secs = [...el.querySelectorAll('.content > .sec:not(.rv)')];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('rv-in'); io.unobserve(e.target); } }), {root: sc, threshold: .1, rootMargin: '0px 0px -6% 0px'});
  let n = 0;
  secs.forEach(s => { s.classList.add('rv'); const r = s.getBoundingClientRect(), rr = sc.getBoundingClientRect(); s.style.setProperty('--rd', (r.top < rr.bottom ? (n++) * 110 + 120 : 0) + 'ms'); io.observe(s); });
}
function fitFolds(el){
  el.querySelectorAll('.fold').forEach(f => {
    if (f.classList.contains('open')) return; f.classList.remove('short');
    const tw = f.querySelector('.tw'), items = [...tw.querySelectorAll('.txt > p, .txt > ul > li')], LIM = 175;
    let h = 0;
    for (const it of items){ const b = it.offsetTop + it.offsetHeight; if (b <= LIM || h === 0) h = b; else break; }
    if (h >= tw.scrollHeight - 4){ f.classList.add('short'); tw.style.maxHeight = 'none'; return; }
    tw.dataset.ch = h; tw.style.transition = 'none'; tw.style.maxHeight = h + 'px'; void tw.offsetHeight; tw.style.transition = '';
  });
}
window.addEventListener('resize', () => { const el = cur(); if (!el) return; fitFolds(el); if (S.cur === 'intro') placeIntro(el); });

/* ---------- Поведение экранов ---------- */
const AFTER = {
  intro: el => {
    placeIntro(el);
    const hold = new URLSearchParams(location.search).has('hold');
    let stage = 0;
    const fly = () => { if (stage > 0 || S.cur !== 'intro') return; stage = 1; el.classList.add('fly'); hap('soft');
      setTimeout(() => el.classList.add('deep'), 650);
      setTimeout(() => S.cur === 'intro' && go('lang', false, 'fade'), 1750); };
    el.addEventListener('click', () => stage ? go('lang', false, 'fade') : fly());
    if (RM){ el.classList.add('push'); if (!hold) setTimeout(() => S.cur === 'intro' && go('lang', false, 'fade'), 1800); return; }
    setTimeout(() => el.classList.add('push'), 40);
    if (!hold) setTimeout(fly, 1500);
  },
  onb: el => onbInit(el),
  name: el => {
    const inp = el.querySelector('#nm'), nx = el.querySelector('#nx');
    const upd = () => { S.draft.name = inp.value.trim(); nx.disabled = !S.draft.name; };
    inp.addEventListener('input', upd); upd();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && S.draft.name) go('gender'); });
  },
  dob: el => wheelsInit(el),
  main: el => {
    const fan = el.querySelector('.fan');
    if (fan) fanInit(el, fan);
    if (el.dataset.swipe) return; el.dataset.swipe = 1;
    let x0 = null, y0 = 0;
    el.addEventListener('touchstart', e => { if (e.target.closest('.fanwrap,.revs')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (S.tab === 'm' && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setMonth(S.month + (dx < 0 ? 1 : -1));
    });
  },
  success: () => { hap('success'); },
};

/* Пролёт: три слоя фото (небо и море, скала с дверью, коза) приближаются с разной скоростью к двери */
function placeIntro(el){
  const W = el.clientWidth, H = el.clientHeight, iw = 1086, ih = 1448;
  const s = Math.max(W / iw, H / ih), dw = iw * s, dh = ih * s, ox = (W - dw) * .62, oy = (H - dh) * .5;
  const door = [824, 753];
  const set = (n, x, y, w, h, o) => Object.assign(el.querySelector(n).style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', transformOrigin: o});
  const o = `${door[0] * s}px ${door[1] * s}px`;
  set('.ly.bg', ox, oy, dw, dh, o);
  set('.ly.cl', ox, oy, dw, dh, o);
  set('.ly.gt', ox + 472 * s, oy + 652 * s, 228 * s, 230 * s, `${(door[0] - 472) * s}px ${(door[1] - 652) * s}px`);
  el.style.setProperty('--vx', (ox + door[0] * s) + 'px'); el.style.setProperty('--vy', (oy + door[1] * s) + 'px');
}

/* Онбординг: листание пальцем, у картинки и текста разная скорость (параллакс) */
function onbInit(el){
  const vp = el.querySelector('.ovp'), pg = el.querySelector('.pager'), slides = [...el.querySelectorAll('.slide')], ogl = el.querySelector('.ogl');
  const dots = [...el.querySelectorAll('.dots i')];
  let x0 = null, y0 = 0, dx = 0, lock = null;
  const render = anim => {
    pg.classList.toggle('anim', !!anim);
    const W = vp.clientWidth || 1, pos = S.onbI - dx / W;
    pg.style.transform = `translateX(${-pos * 100}%)`;
    slides.forEach((s, k) => { const p = k - pos; s.style.setProperty('--p', p.toFixed(3)); s.style.setProperty('--o', Math.max(0, 1 - Math.abs(p) * 1.3).toFixed(3)); });
    ogl.style.transform = `translateX(${-pos * 14}%)`;
    dots.forEach((d, k) => d.classList.toggle('on', k === S.onbI));
    el.classList.toggle('last', S.onbI === 2);
    slides[S.onbI].classList.add('seen');
  };
  el._onbGo = k => { S.onbI = Math.max(0, Math.min(2, k)); dx = 0; render(!RM); hap('select'); };
  vp.addEventListener('touchstart', e => { if (e.target.closest('.revs')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; lock = null; }, {passive: true});
  vp.addEventListener('touchmove', e => {
    if (x0 == null) return; const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (lock == null && Math.abs(mx) + Math.abs(my) > 8) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock !== 'x') return;
    dx = mx * ((S.onbI === 0 && mx > 0) || (S.onbI === 2 && mx < 0) ? .3 : 1); render(false);
  }, {passive: true});
  vp.addEventListener('touchend', () => { if (x0 == null) return; x0 = null; if (lock === 'x' && Math.abs(dx) > 50) el._onbGo(S.onbI + (dx < 0 ? 1 : -1)); else { dx = 0; render(true); } });
  render(false);
}
function onbNext(){ const el = cur(); if (el && el._onbGo) el._onbGo(S.onbI + 1); }
function finishOnb(){
  if (S.onbFrom){ S.onbFrom = null; S.cur = null; go('profile', false); S.hist = ['main']; return; }
  S.mode = 'self';
  const tn = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name; /* API: имя из Telegram */
  S.draft = {name: tn || '', gender:'', d:1, m:0, y:1990};
  S.hist = []; S.cur = null; go('name', true);
}
function openOnbFromProfile(){ S.onbFrom = 'profile'; S.onbI = 0; go('onb', true, 'fade'); }

/* Барабаны даты: прокрутка с привязкой, объёмный наклон строк, подсказка обновляется сразу */
function wheelsInit(el){
  const IH = 44;
  el.querySelectorAll('.wh').forEach(w => {
    const k = w.dataset.k, items = [...w.querySelectorAll('.wi')];
    const paint = () => { const c = w.scrollTop / IH;
      items.forEach((it, j) => { const d = j - c; if (Math.abs(d) > 4){ if (it.style.transform) { it.style.transform = ''; it.style.opacity = ''; } return; }
        it.style.transform = `rotateX(${(-d * 20).toFixed(1)}deg)`; it.style.opacity = (1 - Math.min(.85, Math.abs(d) * .22)).toFixed(2); it.classList.toggle('on', Math.round(c) === j); }); };
    const commit = () => { const j = Math.max(0, Math.min(items.length - 1, Math.round(w.scrollTop / IH))); const v = +items[j].dataset.v;
      if (S.draft[k] !== v){ S.draft[k] = v; hap('select'); }
      const mx = dim(S.draft.y, S.draft.m); if (S.draft.d > mx){ S.draft.d = mx; const dw = el.querySelector('.wh[data-k="d"]'); dw.scrollTo({top: (mx - 1) * IH, behavior: RM ? 'auto' : 'smooth'}); }
      const h = el.querySelector('#dh span'); if (h) h.innerHTML = dobHint(); };
    const idx = items.findIndex(x => x.dataset.v === String(S.draft[k]));
    w.scrollTop = Math.max(0, idx) * IH; paint();
    let tmo; w.addEventListener('scroll', () => { paint(); clearTimeout(tmo); tmo = setTimeout(commit, 110); }, {passive: true});
    w.addEventListener('click', e => { const it = e.target.closest('.wi'); if (it) w.scrollTo({top: items.indexOf(it) * IH, behavior: RM ? 'auto' : 'smooth'}); });
  });
}

/* Веер карт месяцев: тянешь пальцем, карты поворачиваются по дуге, ближайшая встаёт в центр */
function fanLayout(fan, pos){
  fan.querySelectorAll('.fc').forEach(c => {
    const k = +c.dataset.k, off = k - pos, a = Math.abs(off);
    c.style.transform = `rotate(${(off * 7.2).toFixed(2)}deg) translateY(${(-12 * Math.max(0, 1 - a)).toFixed(1)}px) scale(${(1 - Math.min(a, 4) * .05).toFixed(3)})`;
    c.style.opacity = a > 3.6 ? 0 : Math.max(0, 1 - Math.max(0, a - .6) * .3).toFixed(2);
    c.style.filter = a > .5 ? `brightness(${(1 - Math.min(a, 3) * .12).toFixed(2)})` : '';
    c.style.zIndex = 100 - Math.round(a * 10);
    c.classList.toggle('cur', Math.round(pos) === k);
  });
}
function fanInit(el, fan){
  const wrap = el.querySelector('.fanwrap');
  let pos = S.fanFrom != null ? S.fanFrom : S.month; S.fanFrom = null;
  fanLayout(fan, pos);
  if (pos !== S.month){ void fan.offsetWidth; fan.classList.add('snap'); pos = S.month; fanLayout(fan, pos); }
  let x0 = null, p0 = 0, moved = 0, lastX = 0, lastT = 0, vel = 0, tgt = null;
  wrap.addEventListener('pointerdown', e => { x0 = e.clientX; p0 = pos; moved = 0; vel = 0; lastX = e.clientX; lastT = performance.now(); tgt = e.target.closest('.fc'); fan.classList.remove('snap'); try { wrap.setPointerCapture(e.pointerId); } catch (_) {} });
  wrap.addEventListener('pointermove', e => {
    if (x0 == null) return; const dx = e.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    const np = Math.max(-.45, Math.min(11.45, p0 - dx / 62));
    if (Math.round(np) !== Math.round(pos)) hap('select');
    pos = np; fanLayout(fan, pos);
  });
  const up = () => {
    if (x0 == null) return; x0 = null;
    if (performance.now() - lastT > 90) vel = 0; /* палец остановился: без броска */
    let k = moved < 6 && tgt ? +tgt.dataset.k : Math.round(pos - Math.max(-1.2, Math.min(1.2, vel)) * 1.6);
    k = Math.max(0, Math.min(11, k));
    fan.classList.add('snap'); pos = k; fanLayout(fan, k);
    if (k !== S.month) setMonth(k, true);
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
}

function pickLang(l){ S.lang = l; document.documentElement.lang = l; S.onbI = 0; S.onbFrom = null; go('onb', true, 'fade'); }
function setGender(g){ S.draft.gender = g; rerender(); setTimeout(() => S.cur === 'gender' && go('dob'), 260); }
function confirmData(){
  const D = S.draft; D.d = Math.min(D.d, dim(D.y, D.m));
  const p = {name: cap(D.name), gender: D.gender || 'f', d: D.d, m: D.m, y: D.y, access: 'none', self: S.mode === 'self'};
  /* API: сохранить профиль на сервере */
  if (p.self){ S.profiles = [p]; S.active = 0; S.forIdx = 0; }
  else { S.profiles.push(p); S.forIdx = S.profiles.length - 1; }
  S.hist = []; S.cur = null;
  if (p.self && S.wantDemo){ S.wantDemo = false; startDemo(); } else go('tariffs');
}
function openTariffs(k){ S.forIdx = k; go('tariffs'); }
function toMain(){ S.active = S.forIdx; S.month = 0; S.tab = 'm'; S.ytopic = null; S.hist = []; S.cur = null; go('main', false, 'fade'); }
function startDemo(){ S.active = S.forIdx; S.month = 0; S.tab = 'm'; S.hist = []; S.cur = null; go('main', false, 'fade'); }
function swapContent(dir = 1){
  const el = cur(), c = el.querySelector('.content'), sc = el.querySelector('.scroll'), h = el.querySelector('.hph');
  if (sc) sc.scrollTop = 0;
  if (RM) return;
  const sp = 'cubic-bezier(.2,1.12,.32,1)';
  if (h) h.animate([{opacity:0, transform:`translateX(${dir * 30}px)`}, {opacity:1, transform:'none'}], {duration:520, easing:sp});
  if (c) c.animate([{opacity:0, transform:`translateX(${dir * 60}px)`}, {opacity:1, transform:'none'}], {duration:620, easing:sp});
}
/* Смена месяца: веер остаётся на месте, меняются фраза, текст и кнопка внизу */
function setMonth(k, fromFan){
  if (k < 0 || k > 11 || k === S.month) return;
  const dir = k > S.month ? 1 : -1, el = cur();
  S.month = k;
  const tmp = document.createElement('div'); tmp.innerHTML = SCREENS.main();
  ['.hph', '.content', '.mcta'].forEach(s => { const a = el.querySelector(s), b = tmp.querySelector(s); if (a && b) a.replaceWith(b); });
  if (!fromFan){ const fan = el.querySelector('.fan'); if (fan){ fan.classList.add('snap'); fanLayout(fan, k); } }
  swapContent(dir); hap('select');
  setTimeout(() => initRead(el), 0);
}
function setTab(t){ if (S.tab === t) return; S.tab = t; rerender(); swapContent(t === 'y' ? 1 : -1); }
function setTopic(k){ const was = S.ytopic; if (was === k) return; S.ytopic = k; rerender(); swapContent(was && k === 'yW' ? -1 : 1); hap('select'); }
function switchTo(k){ S.active = k; S.month = 0; S.tab = 'm'; S.ytopic = null; S.hist = []; S.cur = null; go('main', false); }
function addPerson(){ S.mode = 'other'; S.draft = {name:'', gender:'', d:1, m:0, y:1990}; go('name'); }
function setLang(l){ S.lang = l; document.documentElement.lang = l; rerender(); if (l === 'uk') toast('Украинские тексты добавим следующим шагом'); }
function support(){ /* API: ссылка на поддержку, например t.me/аккаунт */ toast('Здесь откроется чат с поддержкой'); }
function toast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:absolute;left:24px;right:24px;bottom:calc(96px + var(--safe-b));z-index:30;padding:14px 18px;border-radius:16px;background:var(--ink);color:#fff;font:500 14px/1.4 var(--f-text);text-align:center;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .4s var(--spring)';
  t.textContent = msg; app.appendChild(t); void t.offsetWidth; t.style.opacity = 1; t.style.transform = 'none';
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2200);
}

/* ---------- Нижние шторки ---------- */
function sheet(title, html){
  closeSheet(true);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.onclick = () => closeSheet();
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="sh-head"><span class="t">${title}</span><button class="ib ghost" onclick="closeSheet()" aria-label="Закрыть">${I.close}</button></div><div class="sh-body">${html}</div><div style="height:calc(16px + var(--safe-b))"></div>`;
  app.append(ov, sh); void sh.offsetWidth; ov.classList.add('in'); sh.classList.add('in');
  return sh;
}
function closeSheet(now){ app.querySelectorAll('.ov,.sheet').forEach(x => { if (now) return x.remove(); x.classList.remove('in'); setTimeout(() => x.remove(), 380); }); }
function paySheet(plan){
  S.lastTry = plan;
  const sum = {months: 850, year: 400, all: 1100}[plan];
  const name = {months: '12 месяцев 2027', year: 'Главные повороты года', all: 'Всё вместе: 12 месяцев и год'}[plan];
  const fp = S.profiles[S.forIdx];
  sheet('Оплата', `
    <p>${name}${fp.self ? '' : ', подарок для ' + esc(fp.name)}</p>
    <div class="amount">${sum}<small>грн</small></div>
    ${plan === 'months' && S.promo ? `<p style="color:#1C7247;font-weight:500;margin:-6px 0 12px">+ прогноз на год в подарок</p>` : ''}
    <div class="paynote">${I.card}<span>Сейчас откроется страница оплаты monobank. Можно оплатить картой любого банка, Apple Pay или Google Pay. После оплаты ты вернёшься сюда, и прогноз откроется.</span></div>
    <div style="height:20px"></div>
    <button class="btn primary" onclick="paid('${plan}')">Оплатить ${sum} грн</button>`);
}
/* API: здесь программист вызывает monoPay и ждёт вебхук об успешной оплате. При ошибке: go('fail') */
function paid(plan){
  const p = S.profiles[S.forIdx];
  p.access = plan === 'months' && !S.promo ? 'months' : 'all';
  S.lastPlan = plan; closeSheet(); S.hist = []; S.cur = null; go('success', false, 'fade');
}
function retryPay(){ S.hist = []; S.cur = null; go('tariffs', false); setTimeout(() => paySheet(S.lastTry || 'months'), 350); }
function yearLockSheet(){ sheet('Главные повороты года', `<p>Прогноз на год открывается после 12 месяцев. Возьми всё вместе, так выгоднее на 150 грн.</p><div style="height:20px"></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn primary split" onclick="closeSheet();setTimeout(()=>paySheet('all'),200)"><span>Всё вместе</span><span>1100 грн</span></button>
    <button class="btn secondary split" onclick="closeSheet();setTimeout(()=>paySheet('months'),200)"><span>Только месяцы</span><span>850 грн</span></button>
  </div>`); }
function promoSheet(){
  const sh = sheet('Введи промокод', `
    <p>Промокод можно получить у Вероники в Instagram.</p>
    <input class="uline" id="pc" placeholder="Промокод" autocomplete="off" style="font-size:22px;margin-top:8px">
    <div class="err" id="pe"></div>
    <button class="btn primary" id="pa" disabled style="margin-top:8px">Применить</button>`);
  const inp = sh.querySelector('#pc'), b = sh.querySelector('#pa'), er = sh.querySelector('#pe');
  inp.addEventListener('input', () => { b.disabled = !inp.value.trim(); er.textContent = ''; });
  /* API: проверка промокода на сервере. В прототипе подходит любой код от 4 символов. */
  b.onclick = () => { const v = inp.value.trim(); if (v.length < 4){ er.textContent = 'Такого промокода нет. Проверь, нет ли лишних пробелов.'; hap('error'); return; } S.promo = true; closeSheet(); rerender(); hap('success'); };
}
function gearSheet(){
  const p = prof();
  const seg = (items, c, fn) => `<div class="seg">${items.map(([v, l]) => `<button class="${v === c ? 'on' : ''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
  sheet('Режим прототипа', `
    <div class="gear-row" style="margin-top:4px"><span class="label">Доступ</span>${seg([['none','Демо'],['months','Месяцы'],['all','Всё']], p.access, 'gSetAcc')}</div>
    <div class="gear-row"><span class="label">Пол</span>${seg([['f','Женщина'],['m','Мужчина']], p.gender, 'gSetG')}</div>
    <div class="gear-row"><button class="btn secondary" onclick="closeSheet(true);S.hist=[];S.cur=null;go('fail',false)">Показать: оплата не прошла</button></div>
    <div class="gear-row" style="margin-top:10px"><button class="btn secondary" onclick="closeSheet(true);S.forIdx=0;S.hist=[];S.cur=null;go('success',false,'fade')">Показать: успешная оплата</button></div>
    <div class="gear-row" style="margin-top:10px"><button class="btn secondary" onclick="restart()">Начать заново</button></div>`);
}
function gSetAcc(v){ prof().access = v; gearSheet(); }
function gSetG(v){ prof().gender = v; gearSheet(); }
function restart(){ closeSheet(true); S.mode = 'self'; S.profiles = []; S.promo = false; S.hist = []; S.cur = null; S.month = 0; S.onbI = 0; go('intro', false); }

/* Быстрый вход для просмотра:
   ?demo=intro | lang | onb | name | gender | dob | confirm | tariffs | main | year | profile | success | fail
   &access=none|months|all, &people, &slide=0..2, &hold (заставка без перехода), &still (без анимаций) */
const Q = new URLSearchParams(location.search);
if (Q.has('demo')){
  S.profiles = [{name:'Мария', gender: Q.get('g') || 'f', d:25, m:7, y:1992, access: Q.get('access') || 'none', self:true}];
  if (Q.has('people')) S.profiles.push({name:'Андрей', gender:'m', d:3, m:2, y:1990, access:'none', self:false}, {name:'Елена', gender:'f', d:17, m:10, y:1965, access:'all', self:false});
  const v = Q.get('demo');
  S.month = +(Q.get('month') || 0);
  const D = () => { S.mode = 'self'; S.draft = {name:'Мария', gender: Q.get('g') || 'f', d:25, m:7, y:1992}; S.hist = ['onb']; };
  if (v === 'intro') go('intro', false);
  else if (v === 'lang') go('lang', false);
  else if (v === 'onb'){ S.onbI = +(Q.get('slide') || 0); go('onb', false); }
  else if (v === 'name'){ D(); go('name'); }
  else if (v === 'gender'){ D(); S.draft.gender = Q.get('g') || ''; go('gender'); }
  else if (v === 'dob'){ D(); go('dob'); }
  else if (v === 'confirm'){ D(); go('confirm'); }
  else if (v === 'tariffs'){ S.hist = ['main']; go('tariffs'); }
  else if (v === 'year'){ S.tab = 'y'; S.ytopic = Q.get('topic') || null; go('main', false); }
  else if (v === 'profile'){ S.hist = ['main']; go('profile'); }
  else if (v === 'success'){ S.forIdx = 0; go('success', false); }
  else if (v === 'fail'){ go('fail', false); }
  else go('main', false);
  if (Q.has('expand')) setTimeout(() => { const b = cur().querySelector('.more'); if (b) toggleSec(b); }, 80);
  if (Q.has('scroll')) setTimeout(() => { const sc = cur().querySelector('.scroll'); if (sc) { sc.scrollTop = +Q.get('scroll'); sc.dispatchEvent(new Event('scroll')); } }, 150);
} else go('intro', false);
</script>
