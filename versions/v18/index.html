<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Прогностика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Версия 2: без фотографий. Цвета клиентки:
   текст #071B48, акцент #800020, фон #FFFFFF, рамки #A5B2C5, бордовый градиент. */
:root{
  --ink:#071B48;
  --ink-2:rgba(7,27,72,.64);
  --ink-3:rgba(7,27,72,.40);
  --accent:#800020;
  --bg:#FFFFFF;
  --line:#A5B2C5;
  --line-soft:rgba(165,178,197,.42);
  --mist:#F3F5F9;
  --burg:radial-gradient(ellipse at 80% 100%,#A51B38 0%,#800020 48%,#570019 100%);
  --f-display:'Montserrat',system-ui,sans-serif;
  --f-text:'Inter',system-ui,sans-serif;
  --g:24px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.2,1.12,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}

#app{position:relative;width:100%;height:var(--tg-viewport-stable-height,100dvh);overflow:hidden;background:var(--bg)}
@media (min-width:600px){
  body{display:grid;place-items:center;background:#E7EBF1}
  #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(7,27,72,.18)}
}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;transform:translateX(42px);transition:opacity .35s ease,transform .6s var(--spring)}
.screen.in{opacity:1;transform:none}
.screen.back{transform:translateX(-42px)}
.screen.back.in{transform:none}
/* Анимации появления: элементы экрана выезжают снизу по очереди (версия 16) */
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i, 0) * 55ms + 60ms)}
@keyframes tabin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
  .promo-btn::after{display:none}
}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(7,27,72,.16) transparent}
/* Тонкая полоса прокрутки в цветах проекта */
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:rgba(7,27,72,.16);border-radius:3px;border:1px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:rgba(7,27,72,.3);background-clip:padding-box}

/* Верхняя панель */
.bar{height:64px;margin-top:var(--safe-t);padding:0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bar .title{font:600 16px/1 var(--f-display)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:background .2s}
.ib:active{background:var(--mist)}
.ib svg{width:20px;height:20px}
.ib.ghost{border-color:transparent}
.ib.on-dark{border-color:rgba(255,255,255,.28);color:#fff}
.ib.on-dark:active{background:rgba(255,255,255,.1)}
.spacer{width:44px}
.steps{display:flex;gap:6px}
.steps i{width:28px;height:3px;border-radius:2px;background:var(--line-soft);transition:background .3s}
.steps i.on{background:var(--accent)}

/* Типографика */
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.h1{font:600 28px/1.2 var(--f-display);letter-spacing:-.015em}
.lead{font:400 16px/1.5 var(--f-text);color:var(--ink-2);margin-top:12px}

/* Кнопки */
.bottom{padding:16px var(--g) calc(16px + var(--safe-b));flex-shrink:0;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.btn{height:56px;border-radius:28px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px/1 var(--f-display);letter-spacing:.01em;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--burg);color:#fff}
.btn.primary:disabled{background:var(--mist);color:var(--line);transform:none;cursor:default}
.btn.white{background:#fff;color:var(--ink)}
.btn.secondary{border:1px solid var(--line)}
.btn.text{height:48px;color:var(--ink-2);font-weight:500}
.btn.split{justify-content:space-between;padding:0 26px}
.btn.split .pr{font-weight:600;opacity:.9}

/* Анкета */
.form{padding:20px var(--g) 0}
.field{margin-top:40px}
.uline{width:100%;height:60px;border:0;border-bottom:1.5px solid var(--line);padding:0;font:500 26px/1 var(--f-display);outline:none;background:transparent;border-radius:0;transition:border-color .2s}
.uline:focus{border-color:var(--ink)}
.uline::placeholder{color:var(--ink-3);font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:120px;border:1px solid var(--line);border-radius:22px;display:grid;place-items:center;font:600 19px/1 var(--f-display);transition:background .25s,border-color .25s,color .25s}
.tile.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gseg{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border-radius:20px;padding:5px;gap:4px}
.gseg button{height:58px;border-radius:16px;font:600 17px/1 var(--f-display);color:var(--ink-2);transition:background .25s,color .25s,box-shadow .25s}
.gseg button.on{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(7,27,72,.18)}
.gbig{display:flex;flex-direction:column;gap:12px}
.gbig button{height:72px;border-radius:22px;background:var(--mist);padding:0 22px;display:flex;align-items:center;justify-content:space-between;font:600 19px/1 var(--f-display);transition:background .2s,color .2s,transform .15s}
.gbig button:active{transform:scale(.99)}
.gbig button svg{width:22px;height:22px;opacity:.5}
.gbig button.on{background:var(--ink);color:#fff}
.dob-grid{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:16px}
.dob-grid label{font:500 13px/1 var(--f-display);color:var(--ink-2);display:block;margin-bottom:6px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:56px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:0 22px 0 0;font:500 20px/1 var(--f-display);background:transparent;outline:none;transition:border-color .2s}
.sel select:focus{border-color:var(--ink)}
.sel select.empty{color:var(--ink-3);font-weight:400}
.sel svg{position:absolute;right:0;top:50%;width:16px;height:16px;transform:translateY(-50%);pointer-events:none;color:var(--ink-2)}

/* Заставка: фото с козой на красной скале (версия 12) */
.splash{background:#0B1F45 url(assets/goat.jpg) 60% center/cover no-repeat;color:#fff;transition:none}
.splash::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(7,27,72,.6) 0%,rgba(7,27,72,0) 100%)}
.splash .ttl{position:relative;padding:calc(var(--safe-t) + 74px) var(--g) 0;opacity:0;transform:translateY(10px);transition:opacity .8s ease .2s,transform .8s var(--ease) .2s}
.splash .ttl h1{font:600 46px/1.04 var(--f-display);letter-spacing:-.025em}
.splash.in .ttl{opacity:1;transform:none}

/* Язык (версия 14): вопрос на двух языках и две крупные кнопки */
.lwrap{padding:calc(var(--safe-t) + 44px) var(--g) calc(24px + var(--safe-b));display:flex;flex-direction:column;height:100%}
.lwrap .eyebrow{color:var(--accent)}
.lq{font:600 34px/1.15 var(--f-display);letter-spacing:-.02em;margin-top:20px}
.lq span{display:block;color:var(--ink-3)}
.lchoices{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.lbtn{width:100%;min-height:92px;border:1px solid var(--line);border-radius:22px;padding:0 22px;display:flex;align-items:center;gap:18px;text-align:left;transition:background .2s,border-color .2s,transform .15s}
.lbtn:active{background:var(--mist);border-color:var(--ink);transform:scale(.99)}
.lbtn .code{width:52px;height:52px;border-radius:16px;background:var(--mist);display:grid;place-items:center;font:600 15px/1 var(--f-display);letter-spacing:.06em;color:var(--ink);flex-shrink:0}
.lbtn .n{display:block;font:600 20px/1.2 var(--f-display)}
.lbtn .d{display:block;font:400 14px/1.4 var(--f-text);color:var(--ink-2);margin-top:4px}

/* Проверка */
.navy{background:var(--ink);color:#fff;padding:28px var(--g) 30px}
.navy .k{font:400 15px/1.4 var(--f-text);color:rgba(255,255,255,.7)}
.navy .v{font:600 44px/1 var(--f-display);letter-spacing:-.02em;margin-top:12px}
.note{display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.note svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--accent)}

/* Выбор оплаты: три крупные кнопки (версия 12) */
.plans{display:flex;flex-direction:column;gap:12px;padding:28px var(--g) 0}
.plan{width:100%;min-height:76px;border-radius:22px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;transition:transform .15s ease,filter .2s}
.plan:active{transform:scale(.985)}
.plan .n{font:600 18px/1.25 var(--f-display)}
.plan .p{font:600 22px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.plan .p small{font-size:14px;margin-left:4px;letter-spacing:0}
.plan.p1{background:var(--burg);color:#fff}
.plan.p2{background:var(--ink);color:#fff}
.plan.p3{background:var(--mist);color:var(--ink)}
.plan.lk{color:var(--ink-3)}
.plan.lk .p{display:flex;align-items:center;gap:8px}
.plan.lk svg{width:18px;height:18px}
.plan.done{background:var(--mist);color:var(--ink);cursor:default}
.plan.done:active{transform:none}
.promo-btn{position:relative;overflow:hidden;width:100%;height:60px;border-radius:22px;background:var(--mist);display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px/1 var(--f-display);color:var(--ink);transition:transform .15s ease}
.promo-btn:active{transform:scale(.985)}
.promo-btn svg{width:22px;height:22px;color:var(--accent);position:relative}
.promo-btn span{position:relative}
.promo-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-18deg);animation:shine 3.6s ease-in-out 1.2s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.promo-ok{margin:14px var(--g) 0;font:500 14px/1.45 var(--f-text);color:var(--accent)}

/* Экран успешной оплаты (версия 16) */
.success{background:var(--ink);color:#fff}
.okw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px}
.okmark{width:112px;height:112px;position:relative}
.okmark::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.12);animation:okpulse 1.6s var(--ease) .9s both}
.okmark svg{position:relative;width:100%;height:100%;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.okmark .c{stroke-dasharray:277;stroke-dashoffset:277;animation:draw .7s var(--ease) .15s forwards}
.okmark .k{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s var(--ease) .75s forwards}
.okw h1{font:600 28px/1.2 var(--f-display);letter-spacing:-.015em;margin-top:32px;animation:rise .6s var(--ease) 1s both}
.okw p{font:400 16px/1.55 var(--f-text);color:rgba(255,255,255,.75);margin-top:12px;max-width:300px;animation:rise .6s var(--ease) 1.1s both}
.success .bottom .btn{animation:rise .6s var(--ease) 1.25s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes okpulse{0%{transform:scale(.6);opacity:0}40%{opacity:1}100%{transform:scale(1.5);opacity:0}}

/* Главный экран: фото с козой и стеклянные кнопки (версия 3) */
.home{background:#0B1F45 url(assets/goat.jpg) 60% center/cover no-repeat;color:#fff}
.home::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(7,27,72,.6) 0%,rgba(7,27,72,0) 100%);pointer-events:none}
.home .top{position:relative;display:flex;justify-content:flex-end;padding:calc(var(--safe-t) + 10px) var(--g) 0;height:58px;flex-shrink:0}
.home .ttl{position:relative;padding:16px var(--g) 0}
.home .ttl .who{font:500 14px/1 var(--f-display);color:rgba(255,255,255,.8);margin-bottom:14px}
.home .ttl h1{font:600 46px/1.04 var(--f-display);letter-spacing:-.025em}
.home .choices{position:relative;margin-top:auto;padding:0 var(--g) calc(28px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.glass{width:100%;min-height:116px;border-radius:22px;border:1px solid rgba(255,255,255,.55);background:rgba(74,6,18,.30);-webkit-backdrop-filter:blur(16px) saturate(120%);backdrop-filter:blur(16px) saturate(120%);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 22px 22px 24px;text-align:left;color:#fff;transition:transform .15s ease,background .2s}
.glass:active{transform:scale(.985);background:rgba(74,6,18,.42)}
.glass .n{font:600 30px/1.05 var(--f-display);letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.glass .n svg{width:18px;height:18px;opacity:.75}
.glass .d{display:block;font:500 12px/1.5 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:10px}
.glass > svg{width:28px;height:28px;flex-shrink:0}

/* Шапка месяца и года: синее поле */
.head{flex-shrink:0;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 8px) var(--g) 8px}
.head .top{display:flex;align-items:center;justify-content:space-between;height:48px;margin:0 -10px}
.plain{width:44px;height:44px;display:grid;place-items:center;color:#fff;border-radius:12px;transition:background .2s,opacity .2s}
.plain:active{background:rgba(255,255,255,.08)}
.plain svg{width:26px;height:26px}
.plain:disabled{opacity:.25;cursor:default}
.plain:disabled:active{background:none}
.head:not(.has-strip){padding-bottom:14px}
.head .hl{display:flex;align-items:center;gap:6px;margin-left:-10px}
.htl{font:600 32px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:calc(18px - 10px * var(--c, 0));transform-origin:0 50%;transform:scale(calc(1 - .25 * var(--c, 0)));margin-bottom:calc(-8px * var(--c, 0))}
.hph{font:400 15px/1.45 var(--f-text);color:rgba(255,255,255,.8);margin-top:calc(8px * (1 - var(--c, 0)));opacity:calc(1 - 1.4 * var(--c, 0));max-height:calc(4.4em * (1 - var(--c, 0)));overflow:hidden}
.head .who{font:500 13px/1 var(--f-display);color:rgba(255,255,255,.65);margin-top:18px}
.head .who + .htl{margin-top:8px}
.head.has-strip{padding-bottom:0}
.ytabs{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;height:48px}
.ytabs button{position:relative;font:600 15px/1 var(--f-display);color:rgba(255,255,255,.6);transition:color .2s}
.ytabs button.on{color:#fff}
.ytabs button.on::after{animation:tabin .45s var(--spring);content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:2px 2px 0 0;background:#fff}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin:14px -4px 0;height:46px}
.strip button{position:relative;font:500 11px/1 var(--f-display);color:rgba(255,255,255,.72);letter-spacing:.01em}
.strip button.lk{color:rgba(255,255,255,.34)}
.strip button.on{color:#fff;font-weight:700}
.strip button.on::after{animation:tabin .45s var(--spring);content:"";position:absolute;left:22%;right:22%;bottom:0;height:3px;border-radius:2px 2px 0 0;background:#fff}


/* Блоки прогноза: серые карточки, заголовки бордовые (версия 11) */
.content{padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.sec{background:var(--mist);border-radius:22px;padding:22px 20px 24px}
.sec h3{font:600 18px/1.25 var(--f-display);color:var(--accent);display:flex;align-items:center;gap:8px}
.sec p{font:400 16px/1.65 var(--f-text);color:var(--ink);margin-top:10px}
.txt{margin-top:12px;font:400 16px/1.65 var(--f-text);color:var(--ink)}
.txt p{margin:0}
.txt p + p{margin-top:12px}
.txt b{font-weight:600}
.txt ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.txt li{position:relative;padding-left:22px}
.txt li::before{content:"";position:absolute;left:0;top:.8em;width:10px;height:2px;border-radius:1px;background:var(--accent)}
/* Свёрнутые блоки и появление при прокрутке (версия 17) */
.sec-h{display:block;width:100%;text-align:left}
.fold .tw{position:relative;max-height:9.2em;overflow:hidden;transition:max-height .55s var(--ease)}
.fold .tw::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(180deg,rgba(243,245,249,0),var(--mist));transition:opacity .35s ease;pointer-events:none}
.fold.open .tw::after,.fold.short .tw::after{opacity:0}
.fold.short .tw{max-height:none}
.more{margin-top:2px;margin-bottom:-8px;min-height:44px;font:600 14px/1 var(--f-display);color:var(--accent);display:inline-flex;align-items:center}
.fold.short .more{display:none}
.sec.rv{opacity:0;transform:translateY(48px) scale(.94);transform-origin:50% 0}
.sec.rv h3,.sec.rv .tw,.sec.rv .more{opacity:0;transform:translateY(14px)}
.sec.rv-in{opacity:1;transform:none;transition:opacity .6s ease,transform .85s var(--spring);transition-delay:var(--rd,0ms)}
.sec.rv-in h3,.sec.rv-in .tw,.sec.rv-in .more{opacity:1;transform:none;transition:opacity .5s ease,transform .7s var(--spring),max-height .55s var(--ease)}
.sec.rv-in h3{transition-delay:calc(var(--rd,0ms) + 140ms)}
.sec.rv-in .tw{transition-delay:calc(var(--rd,0ms) + 230ms),calc(var(--rd,0ms) + 230ms),0ms}
.sec.rv-in .more{transition-delay:calc(var(--rd,0ms) + 320ms)}
.rprog{position:absolute;left:0;right:0;bottom:0;height:2px;pointer-events:none}
.rprog i{display:block;height:100%;background:#C23A55;transform-origin:left;transform:scaleX(0)}
.head{position:relative}
.sec.lock{background:var(--mist)}
.sec.lock h3{color:var(--ink-3)}
.sec.lock h3 svg{width:16px;height:16px}
.sec.lock p{color:var(--ink-3);font-size:14px;margin-top:6px}
.closed{padding:4px 0 8px}
.closed .t{font:600 20px/1.3 var(--f-display)}
.closed .d{font:400 15px/1.55 var(--f-text);color:var(--ink-2);margin-top:10px}
.cta{border-top:0}

/* Профиль (версия 4): без линий, группы на светлом фоне */
.lsw{display:flex;gap:2px;margin-right:-8px}
.lsw button{min-width:40px;height:44px;font:500 13px/1 var(--f-display);color:var(--ink-3);letter-spacing:.06em;transition:color .2s}
.lsw button.on{color:var(--ink);font-weight:700}
.me{display:flex;align-items:center;gap:18px;padding:12px var(--g) 8px}
.ava{width:72px;height:72px;border-radius:50%;flex-shrink:0;background:var(--mist);color:var(--ink);display:grid;place-items:center;font:600 30px/1 var(--f-display);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.me .nm{font:600 28px/1.1 var(--f-display);letter-spacing:-.02em}
.me .sub{font:400 15px/1.45 var(--f-text);color:var(--ink-2);margin-top:8px}
.group{padding:0 var(--g);margin-top:32px}
.group > .eyebrow{color:var(--ink-3);display:block;margin-bottom:12px}
.list{background:var(--mist);border-radius:20px;padding:4px 0}

.item[role=button]{cursor:pointer}
.item .k{color:var(--ink-2);font-weight:400}
.item .v{font-weight:500;text-align:right;padding-right:6px}
.item .who{display:flex;align-items:center;gap:12px}

.pill.ok{background:#E3F3EA;color:#1C7247}
.pill.buy{background:var(--burg);color:#fff;height:36px;padding:0 18px;border-radius:18px;position:relative}
.pill.buy::before{content:"";position:absolute;inset:-4px}
.proto{display:block;margin:56px auto 0;min-height:44px;padding:0 16px;font:500 13px/1 var(--f-display);color:var(--ink-3)}

.ov{position:absolute;inset:0;background:rgba(7,27,72,.42);opacity:0;transition:opacity .28s ease;z-index:20}
.ov.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;transform:translateY(100%);transition:transform .38s var(--ease);max-height:88%;display:flex;flex-direction:column}

.seg button{height:40px;border-radius:10px;font:600 14px/1 var(--f-display);color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(7,27,72,.12)}

.ok-line{font-size:14px;line-height:1.5;color:var(--accent);margin-top:10px;font-weight:500}

function initRead(el){
  const sc = el.querySelector('.scroll'), head = el.querySelector('.head');
  if (!sc || !head || !el.querySelector('.content')) return;
  el.querySelectorAll('.fold').forEach(f => { const tw = f.querySelector('.tw'); if (tw.scrollHeight <= tw.clientHeight + 8) f.classList.add('short'); });
  if (!head.querySelector('.rprog')) head.insertAdjacentHTML('beforeend', '<div class="rprog"><i></i></div>');
  const bar = head.querySelector('.rprog i');
  const upd = () => { const max = sc.scrollHeight - sc.clientHeight; bar.style.transform = `scaleX(${max > 0 ? Math.min(1, sc.scrollTop / max) : 0})`; if (!RM) el.querySelector('.head').style.setProperty('--c', Math.min(1, sc.scrollTop / 140).toFixed(3)); };
  if (!sc.dataset.rp){ sc.dataset.rp = 1; sc.addEventListener('scroll', upd, {passive: true}); }
  upd();
  if (RM || !('IntersectionObserver' in window)) return;
  const secs = [...el.querySelectorAll('.content > .sec')];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('rv-in'); io.unobserve(e.target); } }), {root: sc, threshold: .12, rootMargin: '0px 0px -6% 0px'});
  let n = 0;
  secs.forEach(s => { s.classList.add('rv'); const r = s.getBoundingClientRect(), rr = sc.getBoundingClientRect(); s.style.setProperty('--rd', (r.top < rr.bottom ? (n++) * 110 + 120 : 0) + 'ms'); io.observe(s); });
}

/* ---------- Поведение экранов ---------- */
const AFTER = {
  main: el => { /* свайп влево и вправо листает месяцы */
    if (el.dataset.swipe) return; el.dataset.swipe = 1;
    let x0 = null, y0 = 0;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setMonth(S.month + (dx < 0 ? 1 : -1));
    });
  },
  splash: () => setTimeout(() => S.cur === 'splash' && !new URLSearchParams(location.search).has('hold') && go('lang', false), 2500),
  name: el => {
    const inp = el.querySelector('#nm'), nx = el.querySelector('#nx');
    const upd = () => { S.draft.name = inp.value.trim(); nx.disabled = !S.draft.name; };
    inp.addEventListener('input', upd); upd();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && S.draft.name) go('gender'); });
  },
  dob: el => {
    const nx = el.querySelector('#nx');
    const ok = () => { const D = S.draft; nx.disabled = D.d === '' || D.m === '' || D.y === ''; };
    el.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
      const D = S.draft, v = s.value === '' ? '' : +s.value;
      if (s.id === 'dd') D.d = v; if (s.id === 'mm') D.m = v; if (s.id === 'yy') D.y = v;
      if (D.d !== '' && D.m !== '') D.d = Math.min(D.d, dim(+D.y || 2001, D.m));
      if (s.id !== 'dd') rerender(); else { s.classList.remove('empty'); ok(); }
    }));
    ok();
  },
};

function pickLang(l){ S.lang = l; document.documentElement.lang = l; S.mode = 'self'; S.draft = {name:'', gender:'', d:'', m:'', y:''}; go('name'); }
function setGender(g, auto){ S.draft.gender = g; rerender(); if (auto) setTimeout(() => S.cur === 'gender' && go('dob'), 220); }
function confirmData(){
  const D = S.draft;
  const p = {name: cap(D.name), gender: D.gender, d: D.d, m: D.m, y: D.y, access: 'none', self: S.mode === 'self'};
  /* API: сохранить профиль на сервере */
  if (p.self){ S.profiles = [p]; S.active = 0; S.forIdx = 0; }
  else { S.profiles.push(p); S.forIdx = S.profiles.length - 1; }
  S.hist = []; S.cur = null; go('tariffs');
}
function openTariffs(k){ S.forIdx = k; go('tariffs'); }
function toMain(){ S.active = S.forIdx; S.month = null; S.hist = []; S.cur = null; go('home'); }
function goHome(){ S.hist = []; S.cur = null; go('home'); }
function startDemo(){ S.active = S.forIdx; S.month = 0; S.hist = ['home']; S.cur = null; go('main', false); }
function openMonths(){ S.month = null; go('main'); }
function swapContent(dir = 1){
  const el = app.querySelector('.screen:last-of-type'), c = el.querySelector('.content'), h = el.querySelector('.htl'), sc = el.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
  if (RM) return;
  const sp = 'cubic-bezier(.2,1.12,.32,1)';
  if (h) h.animate([{opacity:0, transform:`translateX(${dir * 36}px)`}, {opacity:1, transform:'none'}], {duration:520, easing:sp});
  if (c) c.animate([{opacity:0, transform:`translateX(${dir * 60}px)`}, {opacity:1, transform:'none'}], {duration:620, easing:sp});
}
function setMonth(k){ if (k < 0 || k > 11 || k === S.month) return; const dir = k > S.month ? 1 : -1; S.month = k; rerender(); swapContent(dir); hap('select'); }
function setTopic(k){ if ((S.ytopic || 'yW') === k) return; S.ytopic = k; rerender(); swapContent(k === 'yL' ? 1 : -1); hap('select'); }
function switchTo(k){ S.active = k; S.month = null; S.hist = []; S.cur = null; go('home'); }
function addPerson(){ S.mode = 'other'; S.draft = {name:'', gender:'', d:'', m:'', y:''}; go('name'); }
function setLang(l){ S.lang = l; document.documentElement.lang = l; rerender(); }

/* ---------- Нижние шторки ---------- */
function sheet(title, html){
  closeSheet(true);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.onclick = () => closeSheet();
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="sh-head"><span class="t">${title}</span><button class="ib ghost" onclick="closeSheet()" aria-label="Закрити">${I.close}</button></div><div class="sh-body">${html}</div><div style="height:calc(16px + var(--safe-b))"></div>`;
  app.append(ov, sh);
  void sh.offsetWidth;
  ov.classList.add('in'); sh.classList.add('in');
  return sh;
}
function closeSheet(now){
  app.querySelectorAll('.ov,.sheet').forEach(x => { if (now) return x.remove(); x.classList.remove('in'); setTimeout(() => x.remove(), 380); });
}
function paySheet(plan){
  const sum = {months: 850, year: 400, all: 1100}[plan];
  const name = {months: t('pM'), year: t('pY'), all: `${t('pA')}: ${t('pM').toLowerCase()} + ${t('pY').toLowerCase()}`}[plan];
  const fp = S.profiles[S.forIdx];
  sheet(t('payT'), `
    <p>${name}${fp.self ? '' : ', ' + esc(fp.name)}</p>
    <div class="amount">${sum}<small>${t('uah')}</small></div>
    <p>${t('payNote')}</p>
    ${plan === 'months' && S.promo ? `<p class="ok-line">${t('gift')}</p>` : ''}
    <div style="height:24px"></div>
    <button class="btn primary" onclick="paid('${plan}')">${t('pay', {sum})}</button>`);
}
/* API: здесь программист вызывает monoPay и ждёт вебхук об успешной оплате */

function gSetAcc(v){ prof().access = v; rerender(); gearSheet(); }

function restart(){ closeSheet(true); S.mode = 'self'; S.profiles = []; S.promo = false; S.hist = []; S.cur = null; S.month = null; go('splash', false); }

/* Быстрый вход для просмотра:
   ?demo=splash | lang | gender | home | month | year | profile | confirm | tariffs | success, &gv=a|b|c (вариант выбора пола), плюс &access=none|months|all и &lang=ru */
const Q = new URLSearchParams(location.search);
if (Q.has('demo')){
  S.lang = Q.get('lang') === 'ru' ? 'ru' : 'uk';
  S.profiles = [{name: S.lang === 'ru' ? 'Мария' : 'Марія', gender:'f', d:25, m:7, y:1992, access: Q.get('access') || 'none', self:true}];
  if (Q.has('people')) S.profiles.push({name: S.lang === 'ru' ? 'Андрей' : 'Андрій', gender:'m', d:3, m:2, y:1990, access:'none', self:false}, {name:'Олена', gender:'f', d:17, m:10, y:1965, access:'all', self:false});
  const v = Q.get('demo') || 'home';
  go('home', false);
  if (v === 'month'){ go('main'); if (Q.has('expand')) setTimeout(() => { const b = app.querySelector('.screen:last-of-type .more'); if (b) toggleSec(b); }, 50); }
  if (v === 'year') go('year');
  if (v === 'profile') go('profile');
  if (v === 'tariffs') go('tariffs');
  if (v === 'success'){ S.lastPlan = Q.get('plan') || 'months'; S.forIdx = 0; go('success', false); }
  if (v === 'lang'){ S.hist = []; S.cur = null; go('lang', false); }
  if (v === 'gender'){ S.mode = 'self'; S.draft = {name:'Марія', gender: Q.get('g') || '', d:'', m:'', y:''}; go('gender'); }
  if (v === 'splash'){ S.hist = []; S.cur = null; S.profiles = []; go('splash', false); }
  if (v === 'confirm'){ S.mode = 'self'; S.draft = {name: S.profiles[0].name, gender:'f', d:2, m:2, y:2009}; go('confirm'); }
  if (Q.has('scroll')) setTimeout(() => { const sc = app.querySelector('.screen:last-of-type .scroll'); if (sc) { sc.scrollTop = +Q.get('scroll'); sc.dispatchEvent(new Event('scroll')); } }, 120);
} else go('splash', false);
</script>
</body>
</html>
