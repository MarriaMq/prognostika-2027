<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Прогностика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Версия 2: без фотографий. Цвета клиентки:
   текст #071B48, акцент #800020, фон #FFFFFF, рамки #A5B2C5, бордовый градиент. */
:root{
  --ink:#071B48;
  --ink-2:rgba(7,27,72,.64);
  --ink-3:rgba(7,27,72,.40);
  --accent:#800020;
  --bg:#FFFFFF;
  --line:#A5B2C5;
  --line-soft:rgba(165,178,197,.42);
  --mist:#F3F5F9;
  --burg:radial-gradient(ellipse at 80% 100%,#A51B38 0%,#800020 48%,#570019 100%);
  --f-display:'Montserrat',system-ui,sans-serif;
  --f-text:'Inter',system-ui,sans-serif;
  --g:24px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}

#app{position:relative;width:100%;height:var(--tg-viewport-stable-height,100dvh);overflow:hidden;background:var(--bg)}
@media (min-width:600px){
  body{display:grid;place-items:center;background:#E7EBF1}
  #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(7,27,72,.18)}
}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;transition:opacity .3s ease}
.screen.in{opacity:1}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Верхняя панель */
.bar{height:64px;margin-top:var(--safe-t);padding:0 var(--g);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bar .title{font:600 16px/1 var(--f-display)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:background .2s}
.ib:active{background:var(--mist)}
.ib svg{width:20px;height:20px}
.ib.ghost{border-color:transparent}
.ib.on-dark{border-color:rgba(255,255,255,.28);color:#fff}
.ib.on-dark:active{background:rgba(255,255,255,.1)}
.spacer{width:44px}
.steps{display:flex;gap:6px}
.steps i{width:28px;height:3px;border-radius:2px;background:var(--line-soft);transition:background .3s}
.steps i.on{background:var(--accent)}

/* Типографика */
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.h1{font:600 28px/1.2 var(--f-display);letter-spacing:-.015em}
.lead{font:400 16px/1.5 var(--f-text);color:var(--ink-2);margin-top:12px}

/* Кнопки */
.bottom{padding:16px var(--g) calc(16px + var(--safe-b));flex-shrink:0;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.btn{height:56px;border-radius:28px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px/1 var(--f-display);letter-spacing:.01em;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--burg);color:#fff}
.btn.primary:disabled{background:var(--mist);color:var(--line);transform:none;cursor:default}
.btn.secondary{border:1px solid var(--line)}
.btn.text{height:48px;color:var(--ink-2);font-weight:500}
.btn.split{justify-content:space-between;padding:0 26px}
.btn.split .pr{font-weight:600;opacity:.9}

/* Анкета */
.form{padding:20px var(--g) 0}
.field{margin-top:40px}
.uline{width:100%;height:60px;border:0;border-bottom:1.5px solid var(--line);padding:0;font:500 26px/1 var(--f-display);outline:none;background:transparent;border-radius:0;transition:border-color .2s}
.uline:focus{border-color:var(--ink)}
.uline::placeholder{color:var(--ink-3);font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:132px;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;transition:background .25s,border-color .25s,color .25s}
.tile .l{font:600 18px/1 var(--f-display)}
.tile .mk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);align-self:flex-end;display:grid;place-items:center;transition:all .25s}
.tile .mk svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.tile.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tile.on .mk{background:#fff;border-color:#fff;color:var(--ink)}
.tile.on .mk svg{opacity:1}
.dob-grid{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:16px}
.dob-grid label{font:500 13px/1 var(--f-display);color:var(--ink-2);display:block;margin-bottom:6px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:56px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:0 22px 0 0;font:500 20px/1 var(--f-display);background:transparent;outline:none;transition:border-color .2s}
.sel select:focus{border-color:var(--ink)}
.sel select.empty{color:var(--ink-3);font-weight:400}
.sel svg{position:absolute;right:0;top:50%;width:16px;height:16px;transform:translateY(-50%);pointer-events:none;color:var(--ink-2)}

/* Заставка */
.splash{background:var(--burg);color:#fff;align-items:center;justify-content:center;transition:none}
.splash .goat{width:168px;color:#fff;margin-bottom:56px}
.splash .wm{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 56px);text-align:center}
.splash .wm .eyebrow{color:rgba(255,255,255,.72)}
.splash .wm .y{font:600 34px/1 var(--f-display);letter-spacing:.02em;margin-top:12px}
.splash .goat,.splash .wm{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s var(--ease)}
.splash .wm{transition-delay:.25s}
.splash.in .goat,.splash.in .wm{opacity:1;transform:none}

/* Язык */
.lang .top{padding:calc(var(--safe-t) + 28px) var(--g) 0}
.lang .goat{width:56px;color:var(--accent)}
.lang .hero{margin-top:auto;padding:0 var(--g)}
.lang .hero .eyebrow{color:var(--accent)}
.lang .big{font:600 112px/.9 var(--f-display);letter-spacing:-.05em;margin-top:16px;margin-left:-4px}
.lang .ask{font:400 17px/1.5 var(--f-text);color:var(--ink-2);margin-top:24px}
.opts{padding:32px var(--g) calc(20px + var(--safe-b))}
.opt{width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft);font:600 18px/1 var(--f-display)}
.opt:last-child{border-bottom:1px solid var(--line-soft)}
.opt .c{font:500 13px/1 var(--f-display);color:var(--ink-3);letter-spacing:.08em;display:flex;align-items:center;gap:12px}
.opt .c svg{width:18px;height:18px;color:var(--ink)}
.opt:active{background:var(--mist)}

/* Проверка */
.rows{border-top:1px solid var(--line-soft)}
.row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line-soft);font-size:16px}
.row .k{color:var(--ink-2)}
.row .v{font-weight:500;text-align:right}
button.row{width:100%;text-align:left}
button.row .v{display:flex;align-items:center;gap:6px}
button.row .v svg{width:16px;height:16px;color:var(--ink-3)}
.navy{background:var(--ink);color:#fff;padding:28px var(--g) 30px}
.navy .k{font:400 15px/1.4 var(--f-text);color:rgba(255,255,255,.7)}
.navy .v{font:600 44px/1 var(--f-display);letter-spacing:-.02em;margin-top:12px}
.note{display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.note svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--accent)}

/* Тарифы */
.band{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:24px var(--g) 26px;text-align:left;align-items:start}
.band:active{filter:brightness(.95)}
.band .n{font:600 18px/1.25 var(--f-display)}
.band .d{grid-column:1;font:400 14px/1.45 var(--f-text);opacity:.76}
.band .p{grid-row:1 / span 2;grid-column:2;font:600 32px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.band .p small{font-size:14px;font-weight:600;margin-left:4px;letter-spacing:0}
.band .x{grid-column:1 / -1;font:600 13px/1 var(--f-display);margin-top:6px}
.band.b1{background:var(--burg);color:#fff}
.band.b2{background:var(--ink);color:#fff}
.band.b3{background:var(--mist);color:var(--ink)}
.band.off{cursor:default}
.band.off:active{filter:none}
.band.off .n,.band.off .p{color:var(--ink-3)}
.band.off .x{color:var(--ink-2);font-weight:500}
.band.done{cursor:default}
.band.done:active{filter:none}
.band.done .p{font-size:15px;font-weight:600;letter-spacing:0;padding-top:3px}
.links{display:flex;flex-direction:column;align-items:flex-start;padding:16px var(--g) 24px}
.link{min-height:44px;font:500 15px/1 var(--f-display);color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line)}
.link.muted{color:var(--ink-2)}

/* Главный экран: фото с козой и стеклянные кнопки (версия 3) */
.home{background:#0B1F45 url(assets/goat.jpg) 60% center/cover no-repeat;color:#fff}
.home::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(7,27,72,.6) 0%,rgba(7,27,72,0) 100%);pointer-events:none}
.home .top{position:relative;display:flex;justify-content:flex-end;padding:calc(var(--safe-t) + 10px) var(--g) 0;height:58px;flex-shrink:0}
.home .ttl{position:relative;padding:16px var(--g) 0}
.home .ttl .who{font:500 14px/1 var(--f-display);color:rgba(255,255,255,.8);margin-bottom:14px}
.home .ttl h1{font:600 46px/1.04 var(--f-display);letter-spacing:-.025em}
.home .ttl .eyebrow{display:block;color:rgba(255,255,255,.85);margin-top:22px;letter-spacing:.2em}
.home .choices{position:relative;margin-top:auto;padding:0 var(--g) calc(28px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.glass{width:100%;min-height:116px;border-radius:22px;border:1px solid rgba(255,255,255,.55);background:rgba(74,6,18,.30);-webkit-backdrop-filter:blur(16px) saturate(120%);backdrop-filter:blur(16px) saturate(120%);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 22px 22px 24px;text-align:left;color:#fff;transition:transform .15s ease,background .2s}
.glass:active{transform:scale(.985);background:rgba(74,6,18,.42)}
.glass .n{font:600 30px/1.05 var(--f-display);letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.glass .n svg{width:18px;height:18px;opacity:.75}
.glass .d{display:block;font:500 12px/1.5 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:10px}
.glass > svg{width:28px;height:28px;flex-shrink:0}

/* Шапка месяца и года: синее поле */
.head{flex-shrink:0;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 8px) var(--g) 8px}
.head .top{display:flex;align-items:center;justify-content:space-between;height:48px;margin:0 -10px}
.plain{width:44px;height:44px;display:grid;place-items:center;color:#fff;border-radius:12px;transition:background .2s,opacity .2s}
.plain:active{background:rgba(255,255,255,.08)}
.plain svg{width:26px;height:26px}
.plain:disabled{opacity:.25;cursor:default}
.plain:disabled:active{background:none}
.head:not(.has-strip){padding-bottom:14px}
.head .hl{display:flex;align-items:center;gap:6px;margin-left:-10px}
.vsw{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:3px}
.vsw button{height:34px;padding:0 14px;border-radius:17px;font:600 13px/1 var(--f-display);color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.vsw button svg{width:12px;height:12px}
.vsw button.on{background:#fff;color:var(--ink)}
.htl{font:600 32px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:18px}
.hph{font:400 15px/1.45 var(--f-text);color:rgba(255,255,255,.8);margin-top:8px}
.head .who{font:500 13px/1 var(--f-display);color:rgba(255,255,255,.65);margin-top:18px}
.head .who + .htl{margin-top:8px}
.head.has-strip{padding-bottom:0}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin:14px -4px 0;height:46px}
.strip button{position:relative;font:500 11px/1 var(--f-display);color:rgba(255,255,255,.72);letter-spacing:.01em}
.strip button.lk{color:rgba(255,255,255,.34)}
.strip button.on{color:#fff;font-weight:700}
.strip button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:3px;border-radius:2px 2px 0 0;background:#fff}


.content{padding:0 var(--g) 24px}
.sec{padding:24px 0 26px;border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:0}
.sec h3{font:600 18px/1.25 var(--f-display);display:flex;align-items:center;gap:8px}
.sec p{font:400 16px/1.65 var(--f-text);margin-top:10px}
.sec.lock h3{color:var(--ink-3)}
.sec.lock h3 svg{width:16px;height:16px}
.sec.lock p{color:var(--ink-3);font-size:14px;margin-top:6px}
.closed{padding:24px 0 8px}
.closed .t{font:600 20px/1.3 var(--f-display)}
.closed .d{font:400 15px/1.55 var(--f-text);color:var(--ink-2);margin-top:10px}
.cta{border-top:0}

/* Профиль (версия 4): без линий, группы на светлом фоне */
.lsw{display:flex;background:var(--mist);border-radius:22px;padding:4px;gap:2px}
.lsw button{min-width:44px;height:36px;border-radius:18px;font:600 13px/1 var(--f-display);color:var(--ink-2);letter-spacing:.04em;transition:background .2s,color .2s}
.lsw button.on{background:var(--ink);color:#fff}
.me{display:flex;align-items:center;gap:18px;padding:12px var(--g) 8px}
.ava{width:76px;height:76px;border-radius:50%;flex-shrink:0;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 30px/1 var(--f-display);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.me .nm{font:600 28px/1.1 var(--f-display);letter-spacing:-.02em}
.me .sub{font:400 15px/1.45 var(--f-text);color:var(--ink-2);margin-top:8px}
.group{padding:0 var(--g);margin-top:32px}
.group > .eyebrow{color:var(--ink-3);display:block;margin-bottom:12px}
.list{background:var(--mist);border-radius:20px;padding:4px 0}
.item{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 8px 18px;font:500 16px/1.3 var(--f-text);text-align:left}
.item[role=button]{cursor:pointer}
.item .who{display:flex;align-items:center;gap:12px}
.item .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;background:#fff}
.item .dot.on{border-color:var(--ink);background:var(--ink);color:#fff}
.item .dot svg{width:12px;height:12px}
.item.add{color:var(--accent);font:600 15px/1 var(--f-display);justify-content:flex-start;gap:12px;padding-left:18px}
.item.add svg{width:20px;height:20px}
.pill{height:32px;padding:0 14px;border-radius:16px;display:inline-flex;align-items:center;font:600 13px/1 var(--f-display);white-space:nowrap}
.pill.ok{background:#E3F3EA;color:#1C7247}
.pill.buy{background:var(--burg);color:#fff;height:36px;padding:0 18px;border-radius:18px;position:relative}
.pill.buy::before{content:"";position:absolute;inset:-4px}
.proto{display:block;margin:56px auto 0;min-height:44px;padding:0 16px;font:500 13px/1 var(--f-display);color:var(--ink-3)}

/* Шторки */
.ov{position:absolute;inset:0;background:rgba(7,27,72,.42);opacity:0;transition:opacity .28s ease;z-index:20}
.ov.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;transform:translateY(100%);transition:transform .38s var(--ease);max-height:88%;display:flex;flex-direction:column}
.sheet.in{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px var(--g) 4px 24px}
.sh-head .t{font:600 18px/1.2 var(--f-display)}
.sh-body{padding:8px var(--g);overflow-y:auto}
.sh-body p{font-size:15px;line-height:1.6;color:var(--ink-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--mist);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font:600 14px/1 var(--f-display);color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(7,27,72,.12)}
.gear-row{margin-top:20px}
.gear-row:first-child{margin-top:4px}
.label{font:500 13px/1 var(--f-display);color:var(--ink-2);display:block;margin-bottom:10px}
.amount{font:600 44px/1 var(--f-display);margin:14px 0 10px;letter-spacing:-.02em}
.amount small{font-size:18px;margin-left:6px;letter-spacing:0}
.ok-line{font-size:14px;line-height:1.5;color:var(--accent);margin-top:10px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Прогностика 2027 · HTML-прототип интерфейса, версия 2
   Места для программиста помечены комментарием "API:".
   ============================================================ */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData) { tg.ready(); tg.expand(); }

/* Фирменный знак: коза. Отдельные части, чтобы потом анимировать прыжок. */
const GOAT = `<svg class="goat" viewBox="0 0 120 96" aria-hidden="true">
  <ellipse class="shadow" cx="58" cy="91" rx="34" ry="3.5" fill="#000" opacity=".16"/>
  <g class="body" fill="currentColor">
    <path d="M28 41Q28 32 38 32L76 32Q86 32 86 42L86 52Q86 62 76 62L38 62Q28 62 28 52Z"/>
    <path d="M72 36L82 14L92 16L86 44Z"/>
    <path d="M82 12Q86 8 92 10L104 18Q108 21 104 24L94 26L86 22Z"/>
    <path d="M96 25L94 34L91 26Z"/><path d="M84 16L74 19L82 21Z"/>
    <rect x="33" y="56" width="5" height="31" rx="2.5"/><rect x="43" y="56" width="5" height="31" rx="2.5"/>
    <rect x="71" y="56" width="5" height="31" rx="2.5"/><rect x="79" y="56" width="5" height="31" rx="2.5"/>
    <path d="M30 37L22 28L26 26L33 34Z"/>
    <path d="M88 11Q84 0 72 3" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  </g></svg>`;

const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',

const pad = n => String(n).padStart(2,'0');
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const fmt = (d, y) => pad(d.getDate()) + '.' + pad(d.getMonth()+1) + (y ? '.' + d.getFullYear() : '');

/* Личный месяц i: с числа рождения в месяце i по день до числа рождения в следующем.
   API: финальные правила даст клиентка, программист продублирует их на сервере. */
function monthRange(p, i){
  const s = new Date(2027, i, Math.min(p.d, dim(2027, i)));
  const ny = i === 11 ? 2028 : 2027, nm = (i+1) % 12;
  const e = new Date(ny, nm, Math.min(p.d, dim(ny, nm))); e.setDate(e.getDate() - 1);
  return [s, e];
}
const newYearDate = p => new Date(2027, p.m, Math.min(p.d, dim(2027, p.m)));
function demoMonths(p){
  let first = 12;
  for (let i = 0; i < 12; i++) if (monthRange(p, i)[1] >= S.today){ first = i; break; }
  return [first, first+1].filter(i => i < 12);
}
const canSee = (p, i) => p.access !== 'none' || (p.self && demoMonths(p).includes(i));

      ${sel('dd', t('day'), days.map(d => [d, d]), D.d)}
      ${sel('mm', t('month'), MONTHS[S.lang].map((n, i) => [i, n]), D.m)}
      ${sel('yy', t('year'), years.map(v => [v, v]), D.y)}
    </div>
  </div></div>
  <div class="bottom"><button class="btn primary" id="nx" onclick="go('confirm')">${t('next')}</button></div>`;
},

confirm: () => {
  const D = S.draft;
  return `
  <header class="bar">${backBtn}<span class="spacer"></span></header>
  <div class="scroll">
    <div class="form" style="padding-bottom:28px">
      <h1 class="h1">${t('confirmT')}</h1>
      <div class="rows" style="margin-top:28px">
        <div class="row"><span class="k">${t('name')}</span><span class="v">${esc(D.name)}</span></div>
        <div class="row"><span class="k">${t('gender')}</span><span class="v">${t(D.gender === 'f' ? 'female' : 'male')}</span></div>
        <div class="row"><span class="k">${t('dob')}</span><span class="v">${dobStr(D)}</span></div>
      </div>
    </div>
    <div class="navy"><div class="k">${t(S.mode === 'self' ? 'newYear' : 'newYearO')}</div><div class="v">${fmt(newYearDate(D), true)}</div></div>
    <div class="form" style="padding-top:24px"><div class="note">${I.lock}<span>${t('confirmWarn')}</span></div></div>
  </div>
  <div class="bottom">
    <button class="btn primary" onclick="confirmData()">${t('ok')}</button>
    <button class="btn text" onclick="back()">${t('edit')}</button>
  </div>`;
},

tariffs: () => {
  const p = S.profiles[S.forIdx], other = !p.self;
  const mDone = p.access !== 'none', all = p.access === 'all';
  const price = s => `<span class="p">${s}<small>${t('uah')}</small></span>`;
  return `
  <header class="bar">${backBtn}<span class="spacer"></span></header>
  <div class="scroll">
    <div class="form" style="padding-bottom:28px">
      <h1 class="h1">${other ? t('tarTo', {name: esc(p.name)}) : t('tarT')}</h1>
      <p class="lead">${t('tarSub')}</p>
    </div>
    <button class="band b1 ${mDone ? 'done' : ''}" ${mDone ? '' : `onclick="paySheet('months')"`}>
      <span class="n">${t('pM')}</span>${mDone ? `<span class="p">${t('opened')}</span>` : price(850)}
      <span class="d">${t('pMd')}</span>
      ${S.promo && !mDone ? `<span class="x">${t('gift')}</span>` : ''}
    </button>
    ${mDone ? '' : `<button class="band b2" onclick="paySheet('all')">
      <span class="n">${t('pA')}</span>${price('1100')}
      <span class="d">${t('pAd')}</span><span class="x">${t('save')}</span>
    </button>`}
    <button class="band b3 ${mDone ? '' : 'off'} ${all ? 'done' : ''}" ${mDone && !all ? `onclick="paySheet('year')"` : ''}>
      <span class="n">${t('pY')}</span>${all ? `<span class="p">${t('opened')}</span>` : price(400)}
      <span class="d">${t('pYd')}</span>
      ${mDone ? '' : `<span class="x">${t('yLock')}</span>`}
    </button>
    <div class="links">
      ${!mDone && !S.promo ? `<button class="link" onclick="promoSheet()">${t('promo')}</button>` : ''}
      ${other ? `<button class="link muted" onclick="toMain()">${t('later')}</button>` : (!mDone ? `<button class="link muted" onclick="toMain()">${t('demo')}</button>` : '')}
    </div>
  </div>`;
},

home: () => {
  const p = prof(), yOpen = p.access === 'all';
  return `
  <div class="top" style="margin-right:-10px"><button class="plain" onclick="go('profile')" aria-label="${t('profile')}">${I.userB}</button></div>
  <div class="ttl">
    ${p.self ? '' : `<div class="who">${t('tarTo', {name: esc(p.name)})}</div>`}
    <h1>Прогностика<br>2027</h1>
    <span class="eyebrow">${t('homeSub')}</span>
  </div>
  <div class="choices">
    <button class="glass" onclick="openMonths()"><span><span class="n">${t('hM')}</span><span class="d">${t('hMd')}</span></span>${I.arrow}</button>
    <button class="glass" onclick="go('year')"><span><span class="n">${t('hY')}${yOpen ? '' : I.lock}</span><span class="d">${t('hYd')}</span></span>${I.arrow}</button>
  </div>`;
},

year: () => {
  const p = prof(), ye = new Date(2028, p.m, Math.min(p.d, dim(2028, p.m))), open = p.access === 'all';
  const who = p.self ? '' : `<div class="who">${t('tarTo', {name: esc(p.name)})}</div>`;
  const body = open
    ? `<div class="sec"><h3>${t('yW')}</h3><p>${SAMPLE[S.lang].yW}</p></div><div class="sec"><h3>${t('yL')}</h3><p>${SAMPLE[S.lang].yL}</p></div>`
    : `<div class="closed"><div class="t">${t('yClosed')}</div><p class="d">${t(p.access === 'months' ? 'pYd' : 'yClosedD')}</p></div>`;
  return `
  <div class="head">${headTop('year')}
    ${who}<h1 class="htl">${t('pY')}</h1>
    <p class="hph">${t(p.self ? 'yValid' : 'yValidO', {s: fmt(newYearDate(p), true), e: fmt(ye, true)})}</p></div>
  <div class="scroll"><div class="content">
    ${body}
  </div></div>
  ${open ? '' : `<div class="bottom cta"><button class="btn primary split" onclick="openTariffs(${S.active})"><span>${t(p.access === 'months' ? 'yCta' : 'buyFor')}</span><span class="pr">${p.access === 'months' ? '400 ' + t('uah') : ''}</span></button></div>`}`;
},

main: () => {
  const p = prof();
  if (S.month == null) S.month = p.self ? (demoMonths(p)[0] ?? 0) : 0;
  const i = S.month, [s, e] = monthRange(p, i);
  const who = p.self ? '' : `<div class="who">${t('tarTo', {name: esc(p.name)})}</div>`;
  const full = p.access !== 'none', vis = canSee(p, i);
  const keys = ['s1','s2','s3','s4'];
  const open = k => `<div class="sec"><h3>${t(k)}</h3><p>${SAMPLE[S.lang][k]}</p></div>`;
  const shut = k => `<div class="sec lock"><h3>${I.lock}${t(k)}</h3><p>${t('lockLine')}</p></div>`;
  let body;
  if (full) body = keys.map(open).join('');
  else if (vis) body = keys.map(k => k === 's2' ? open(k) : shut(k)).join('');
  else body = p.self
    ? `<div class="closed"><div class="t">${t('closedT')}</div><p class="d">${t('closedD')}</p></div>`
    : `<div class="closed"><div class="t">${t('closedO', {name: esc(p.name)})}</div></div>`;

  return `
  <div class="head has-strip">${headTop('months')}
    ${who}<h1 class="htl">${MONTHS[S.lang][i]}</h1>
    <p class="hph">${t(p.self ? 'mValid' : 'mValidO', {m: MONTHS[S.lang][i].toLowerCase(), s: fmt(s), e: fmt(e)})}</p>
    <div class="strip" role="tablist">${MSHORT[S.lang].map((n, k) => `<button role="tab" aria-selected="${k === i}" class="${k === i ? 'on' : ''} ${canSee(p, k) ? '' : 'lk'}" onclick="setMonth(${k})" aria-label="${MONTHS[S.lang][k]}">${n}</button>`).join('')}</div>
  </div>
  <div class="scroll"><div class="content">
    ${body}
  </div></div>
  ${full ? '' : `<div class="bottom cta"><button class="btn primary split" onclick="openTariffs(${S.active})"><span>${p.self ? t('cta') : t('buyFor')}</span><span class="pr">${p.self ? '850 ' + t('uah') : ''}</span></button></div>`}`;
},

profile: () => {
  const me = S.profiles[0];
  const ok = `<span class="pill ok">${t('bought')}</span>`;
  const buy = k => `<button class="pill buy" onclick="event.stopPropagation();openTariffs(${k})">${t('buy')}</button>`;
  /* API: фото и имя берутся из Telegram (initDataUnsafe.user.photo_url) */
  const photo = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.photo_url;
  const others = S.profiles.map((p, k) => [p, k]).filter(([p]) => !p.self);
  return `
  <header class="bar">${backBtn}
    <div class="lsw" role="group" aria-label="${t('lang')}"><button class="${S.lang === 'uk' ? 'on' : ''}" onclick="setLang('uk')">UA</button><button class="${S.lang === 'ru' ? 'on' : ''}" onclick="setLang('ru')">RU</button></div>
  </header>
  <div class="scroll" style="padding-bottom:16px">
    <div class="me">
      <div class="ava">${photo ? `<img src="${esc(photo)}" alt="">` : esc(me.name.charAt(0).toUpperCase())}</div>
      <div><div class="nm">${esc(me.name)}</div><div class="sub">${dobStr(me)}<br>${t(me.gender === 'f' ? 'female' : 'male')}</div></div>
    </div>

    <div class="group"><span class="eyebrow">${t('forecasts')}</span><div class="list">
      <div class="item"><span>${t('pM')}</span>${me.access === 'none' ? buy(0) : ok}</div>
      <div class="item"><span>${t('pY')}</span>${me.access === 'all' ? ok : buy(0)}</div>
    </div></div>

    <div class="group"><span class="eyebrow">${t('people')}</span><div class="list">
      <button class="item" onclick="switchTo(0)"><span class="who"><span class="dot ${S.active === 0 ? 'on' : ''}">${S.active === 0 ? I.check : ''}</span>${t('me')}</span></button>
      ${others.map(([p, k]) => `<div class="item" role="button" tabindex="0" onclick="switchTo(${k})"><span class="who"><span class="dot ${k === S.active ? 'on' : ''}">${k === S.active ? I.check : ''}</span>${esc(p.name)}</span>${p.access === 'none' ? buy(k) : ok}</div>`).join('')}
      <button class="item add" onclick="addPerson()">${I.plus}${t('add')}</button>
    </div></div>

    <button class="proto" onclick="gearSheet()">${t('gearT')}</button>
  </div>`;
},
};

/* ---------- Поведение экранов ---------- */
const AFTER = {
  main: el => { /* свайп влево и вправо листает месяцы */
    if (el.dataset.swipe) return; el.dataset.swipe = 1;
    let x0 = null, y0 = 0;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setMonth(S.month + (dx < 0 ? 1 : -1));
    });
  },
  splash: () => setTimeout(() => S.cur === 'splash' && go('lang', false), 2500),
  name: el => {
    const inp = el.querySelector('#nm'), nx = el.querySelector('#nx');
    const upd = () => { S.draft.name = inp.value.trim(); nx.disabled = !S.draft.name; };
    inp.addEventListener('input', upd); upd();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && S.draft.name) go('gender'); });
  },
  dob: el => {
    const nx = el.querySelector('#nx');
    const ok = () => { const D = S.draft; nx.disabled = D.d === '' || D.m === '' || D.y === ''; };
    el.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
      const D = S.draft, v = s.value === '' ? '' : +s.value;
      if (s.id === 'dd') D.d = v; if (s.id === 'mm') D.m = v; if (s.id === 'yy') D.y = v;
      if (D.d !== '' && D.m !== '') D.d = Math.min(D.d, dim(+D.y || 2001, D.m));
      if (s.id !== 'dd') rerender(); else { s.classList.remove('empty'); ok(); }
    }));
    ok();
  },
};

function pickLang(l){ S.lang = l; document.documentElement.lang = l; S.mode = 'self'; S.draft = {name:'', gender:'', d:'', m:'', y:''}; go('name'); }
function setGender(g){ S.draft.gender = g; rerender(); }
function confirmData(){
  const D = S.draft;
  const p = {name: D.name, gender: D.gender, d: D.d, m: D.m, y: D.y, access: 'none', self: S.mode === 'self'};
  /* API: сохранить профиль на сервере */
  if (p.self){ S.profiles = [p]; S.active = 0; S.forIdx = 0; }
  else { S.profiles.push(p); S.forIdx = S.profiles.length - 1; }
  S.hist = []; S.cur = null; go('tariffs');
}
function openTariffs(k){ S.forIdx = k; go('tariffs'); }
function toMain(){ S.active = S.forIdx; S.month = null; S.hist = []; S.cur = null; go('home'); }
function switchView(v){ if (S.cur !== v) go(v, false); }
function goHome(){ S.hist = []; S.cur = null; go('home'); }
function openMonths(){ S.month = null; go('main'); }
function setMonth(k){ if (k < 0 || k > 11) return; S.month = k; rerender(); }
function switchTo(k){ S.active = k; S.month = null; S.hist = []; S.cur = null; go('home'); }
function addPerson(){ S.mode = 'other'; S.draft = {name:'', gender:'', d:'', m:'', y:''}; go('name'); }
function setLang(l){ S.lang = l; document.documentElement.lang = l; rerender(); }

/* ---------- Нижние шторки ---------- */
function sheet(title, html){
  closeSheet(true);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.onclick = () => closeSheet();
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="sh-head"><span class="t">${title}</span><button class="ib ghost" onclick="closeSheet()" aria-label="Закрити">${I.close}</button></div><div class="sh-body">${html}</div><div style="height:calc(16px + var(--safe-b))"></div>`;
  app.append(ov, sh);
  void sh.offsetWidth;
  ov.classList.add('in'); sh.classList.add('in');
  return sh;
}
function closeSheet(now){
  app.querySelectorAll('.ov,.sheet').forEach(x => { if (now) return x.remove(); x.classList.remove('in'); setTimeout(() => x.remove(), 380); });
}
function paySheet(plan){
  const sum = {months: 850, year: 400, all: 1100}[plan];
  const name = {months: t('pM'), year: t('pY'), all: t('pA')}[plan];
  const fp = S.profiles[S.forIdx];
  sheet(t('payT'), `
    <p>${name}${fp.self ? '' : ', ' + esc(fp.name)}</p>
    <div class="amount">${sum}<small>${t('uah')}</small></div>
    <p>${t('payNote')}</p>
    ${plan === 'months' && S.promo ? `<p class="ok-line">${t('gift')}</p>` : ''}
    <div style="height:24px"></div>
    <button class="btn primary" onclick="paid('${plan}')">${t('pay', {sum})}</button>`);
}
/* API: здесь программист вызывает monoPay и ждёт вебхук об успешной оплате */
function paid(plan){
  const p = S.profiles[S.forIdx];
  p.access = plan === 'months' && !S.promo ? 'months' : 'all';
  closeSheet(); toMain();
}
function promoSheet(){
  const sh = sheet(t('promoT'), `
    <input class="uline" id="pc" placeholder="${t('promoPh')}" autocomplete="off" style="font-size:22px">
    <div style="height:24px"></div>
    <button class="btn primary" id="pa" disabled>${t('apply')}</button>`);
  const inp = sh.querySelector('#pc'), b = sh.querySelector('#pa');
  inp.addEventListener('input', () => b.disabled = !inp.value.trim());
  /* API: проверка промокода на сервере. В прототипе подходит любой. */
  b.onclick = () => { S.promo = true; closeSheet(); rerender(); };
}
function gearSheet(){
  const p = prof();
  const seg = (items, cur, fn) => `<div class="seg">${items.map(([v, l]) => `<button class="${v === cur ? 'on' : ''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
  sheet(t('gearT'), `
    <div class="gear-row"><span class="label">${t('acc')}</span>${seg([['none', t('accN')], ['months', t('accM')], ['all', t('accA')]], p.access, 'gSetAcc')}</div>
    <div class="gear-row"><span class="label">${t('gender')}</span>${seg([['f', t('female')], ['m', t('male')]], p.gender, 'gSetG')}</div>
    <div class="gear-row"><span class="label">${t('lang')}</span>${seg([['uk', 'Українська'], ['ru', 'Русский']], S.lang, 'gSetL')}</div>
    <div class="gear-row"><button class="btn secondary" onclick="restart()">${t('restart')}</button></div>`);
}
function gSetAcc(v){ prof().access = v; rerender(); gearSheet(); }
function gSetG(v){ prof().gender = v; rerender(); gearSheet(); }
function gSetL(v){ S.lang = v; rerender(); gearSheet(); }
function restart(){ closeSheet(true); S.profiles = []; S.promo = false; S.hist = []; S.cur = null; S.month = null; go('splash', false); }

/* Быстрый вход для просмотра:
   ?demo=home | month | year | profile, плюс &access=none|months|all и &lang=ru */
const Q = new URLSearchParams(location.search);
if (Q.has('demo')){
  S.lang = Q.get('lang') === 'ru' ? 'ru' : 'uk';
  S.profiles = [{name: S.lang === 'ru' ? 'Мария' : 'Марія', gender:'f', d:25, m:7, y:1992, access: Q.get('access') || 'none', self:true}];
  if (Q.has('people')) S.profiles.push({name: S.lang === 'ru' ? 'Андрей' : 'Андрій', gender:'m', d:3, m:2, y:1990, access:'none', self:false}, {name:'Олена', gender:'f', d:17, m:10, y:1965, access:'all', self:false});
  const v = Q.get('demo') || 'home';
  go('home', false);
  if (v === 'month') go('main');
  if (v === 'year') go('year');
  if (v === 'profile') go('profile');
} else go('splash', false);
</script>
</body>
</html>
